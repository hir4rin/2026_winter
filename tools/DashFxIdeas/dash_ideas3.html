<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>ダッシュのエフェクト案3</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;padding:16px;background:#0e1118;color:#e8ecf4;font-family:"Yu Gothic UI",sans-serif}
#grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
canvas{width:100%;border-radius:8px;display:block;cursor:pointer}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.name{font-size:15px;font-weight:bold}.desc{font-size:13px;color:#9aa6bb;margin-top:2px}
button{background:#1f2738;color:#e8ecf4;border:1px solid #3a465e;border-radius:6px;padding:4px 10px;cursor:pointer;font-size:13px}
button:hover{background:#2a3449}
.top{display:flex;gap:12px;align-items:center;margin-bottom:12px;font-size:13px}
</style></head><body>
<div class="top"><button id="all">全部を最初から</button><label><input type="checkbox" id="auto" checked> 4秒ごとにくり返す</label></div>
<div id="grid"></div>
<script>
const ideas=[
['13 霧を割る','床の霧を体が割り、後ろに割れ目と渦が残る'],
['14 影の手','地面から黒い影の手が伸びて追いかけてくる'],
['15 黒い羽根','カラスの羽根が背中から散って舞う'],
['16 闇のオーラ','紫がかった黒い気が体から立ちのぼる'],
['17 空気を斬る','体のまわりに一瞬だけ鋭い斬れ目が走る'],
['18 文字が流れる','「疾」「迅」などの文字が筆で後ろへ流れる'],
['19 カメラの演出','画角が広がり、少し揺れる(エフェクトなし)'],
['20 グリッチ','体のまわりがデジタルのノイズでずれる'],
['21 走査線の残像','ホログラムのような横じまの残像が残る'],
['22 光の轍','両足から床に光の線が引かれて後ろへ伸びる'],
['23 空気中のちり','まわりの空気のちりが速さで線に伸びる'],
['24 体のぶれ','体が後ろへ引き伸ばされてぶれて見える']];
const W=300,H=200,HY=70,CH=2.2,RZ=6,SP=0.2,CYCLE=240,ACC=30;let F=260;
function P(x,y,z){return[W/2+x*F/z,HY+(CH-y)*F/z]}
const rnd=(a,b)=>a+Math.random()*(b-a);
function runner(c,x,z,ph,col,al,sc,dx){sc=sc||1;dx=dx||0;c.save();c.globalAlpha=al;c.fillStyle=col;c.strokeStyle=col;const s=F/z*sc;let [bx,by]=P(x,0,z);bx+=dx;
const bob=Math.abs(Math.sin(ph))*0.06;const hip=[bx,by-(0.95+bob)*s],sh=[bx,by-(1.5+bob)*s];
c.lineCap='round';c.lineWidth=0.22*s;c.beginPath();c.moveTo(hip[0],hip[1]);c.lineTo(sh[0],sh[1]);c.stroke();
c.beginPath();c.arc(bx,by-(1.72+bob)*s,0.13*s,0,7);c.fill();
c.lineWidth=0.13*s;for(const k of[-1,1]){const sw=Math.sin(ph)*k;c.beginPath();c.moveTo(hip[0]+k*0.1*s,hip[1]);c.lineTo(bx+k*0.14*s,by-(0.45+Math.max(0,sw)*0.35)*s);c.lineTo(bx+k*0.14*s,by-Math.max(0,sw)*0.3*s);c.stroke();
c.beginPath();c.moveTo(sh[0]+k*0.17*s,sh[1]+0.05*s);c.lineTo(sh[0]+k*0.33*s,sh[1]+(0.35-sw*0.15)*s);c.stroke();}
c.restore()}
function reset(S){S.t=0;S.dist=0;S.ph=0;S.p=[];S.l=null;S.step=0;S.v=0;S.k=0}
function bg(c,S){c.fillStyle='#1c2333';c.fillRect(0,0,W,H);c.fillStyle='#262f42';c.fillRect(0,HY,W,H-HY);
c.strokeStyle='rgba(170,190,230,0.2)';c.lineWidth=1;
for(let i=0;i<12;i++){const z=((i*1.2-S.dist)%14.4+14.4)%14.4+1.2;const a=P(-30,0,z),b=P(30,0,z);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}
for(const x of[-3,-1.5,1.5,3]){const a=P(x,0,1.2),b=P(x,0,60);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();}}
const DARK='#05070c';
const off=document.createElement('canvas');off.width=W;off.height=H;const oc=off.getContext('2d');
const fog=[];for(let i=0;i<160;i++)fog.push([rnd(-4,4),rnd(0,16),rnd(0.3,0.7)]);
const kanji=['疾','迅','風','影','忍'];
const fx=[
{back(c,S,k){for(const f of fog){const z=((f[1]-S.dist)%16+16)%16+1.3;let x=f[0];let al=0.10;
if(z<RZ){const d=Math.min(1,(RZ-z)/3);const push=k*0.9*Math.exp(-Math.abs(x)*1.2)*(1-d*0.5);x+=Math.sign(x||1)*push;if(Math.abs(x)<0.7*k*(1-d*0.6))al*=0.15}
const[a,b]=P(x,0.05,z),s=F/z;c.fillStyle='rgba(200,212,235,'+al+')';c.beginPath();c.ellipse(a,b,f[2]*s,f[2]*0.3*s,0,0,7);c.fill()}
c.strokeStyle='rgba(220,230,250,'+0.25*k+')';c.lineWidth=1;for(const side of[-1,1])for(let i=0;i<3;i++){const u=((S.t*0.03+i/3)%1);const z=RZ-u*4;const[a,b]=P(side*(0.6+u*0.5),0.08,z),s=F/z;c.beginPath();c.arc(a,b,0.2*s,side>0?3.5:0.3,side>0?6:2.8);c.stroke()}}},
{back(c,S,k){if(k<0.1)return;c.lineCap='round';for(let i=0;i<4;i++){const side=i%2?1:-1;const reach=k*(0.6+0.4*Math.sin(S.t*0.08+i*1.7));const z0=RZ-3.2+i*0.25,x0=side*(0.5+i*0.15);
const tx=side*0.15,tz=RZ-0.2-(1-reach)*2.2;const pts=[];for(let j=0;j<=12;j++){const u=j/12;const z=z0+(tz-z0)*u,x=x0+(tx-x0)*u+Math.sin(u*6+S.t*0.25+i)*0.12,y=Math.sin(u*3.14)*0.35*reach;pts.push(P(x,y,z))}
for(let j=0;j<12;j++){c.strokeStyle='rgba(20,8,30,'+0.85*k+')';c.lineWidth=Math.max(1,(1-j/12)*9+1);c.beginPath();c.moveTo(pts[j][0],pts[j][1]);c.lineTo(pts[j+1][0],pts[j+1][1]);c.stroke()}
const e=pts[12];for(let f=-1;f<=1;f++){c.lineWidth=1.5;c.beginPath();c.moveTo(e[0],e[1]);c.lineTo(e[0]+f*4,e[1]-5);c.stroke()}}}},
{front(c,S,k){if(k>0.3&&S.t%4==0)S.p.push({x:rnd(-0.2,0.2),y:rnd(1.0,1.6),z:RZ-0.15,a:0,da:0.012,vx:rnd(-0.02,0.02),vy:rnd(0,0.015),rot:rnd(0,6),sp:rnd(-0.12,0.12)});
S.p=S.p.filter(p=>p.a<1&&p.z>1.3);for(const p of S.p){p.a+=p.da;p.z-=S.v*0.7;p.x+=p.vx+Math.sin(p.a*15)*0.012;p.y+=p.vy-0.004;p.rot+=p.sp;const[a,b]=P(p.x,p.y,p.z),s=F/p.z;
c.save();c.translate(a,b);c.rotate(p.rot);c.globalAlpha=Math.min(1,(1-p.a)*2);c.fillStyle='#07070b';c.beginPath();c.moveTo(0,-0.2*s);c.quadraticCurveTo(0.07*s,0,0,0.2*s);c.quadraticCurveTo(-0.05*s,0,0,-0.2*s);c.fill();
c.strokeStyle='rgba(120,130,160,0.6)';c.lineWidth=0.8;c.beginPath();c.moveTo(0,-0.2*s);c.lineTo(0,0.24*s);c.stroke();c.restore();}}},
{back(c,S,k){if(k>0.05)for(let i=0;i<5;i++){const y=rnd(0.2,1.8);S.p.push({x:rnd(-0.3,0.3)*(y>1.6?0.5:1),y:y,z:RZ+rnd(-0.05,0.05),a:0,da:rnd(0.03,0.05),vy:0.025,vx:rnd(-0.008,0.008),r:rnd(0.09,0.16)})}
S.p=S.p.filter(p=>p.a<1&&p.z>1.3);for(const p of S.p){p.a+=p.da;p.z-=S.v*0.25;p.y+=p.vy;p.x+=p.vx;const[a,b]=P(p.x,p.y,p.z),s=F/p.z,al=(1-p.a)*0.4;
c.fillStyle='rgba(45,10,60,'+al+')';c.beginPath();c.arc(a,b,p.r*(1+p.a)*s,0,7);c.fill();c.fillStyle='rgba(150,60,200,'+al*0.35+')';c.beginPath();c.arc(a,b,p.r*0.5*s,0,7);c.fill()}}},
{front(c,S,k){if(k>0.3&&S.t%9==0){const ang=rnd(-0.6,0.6)+(Math.random()<0.5?0:3.14);S.p.push({x:rnd(-0.4,0.4),y:rnd(0.4,1.7),z:RZ-0.1,ang:ang,len:rnd(0.8,1.6),a:0})}
S.p=S.p.filter(p=>p.a<1);c.save();c.globalCompositeOperation='lighter';for(const p of S.p){p.a+=1/10;p.z-=S.v*0.5;const s=F/p.z;const[cx,cy]=P(p.x,p.y,p.z);const L=p.len*s*(0.6+p.a*0.6);
const dx=Math.cos(p.ang)*L/2,dy=Math.sin(p.ang)*L/2;const w=(1-p.a)*3+0.5;c.fillStyle='rgba(240,248,255,'+(1-p.a)+')';c.beginPath();c.moveTo(cx-dx,cy-dy);c.lineTo(cx-dy*w/L*2,cy+dx*w/L*2);c.lineTo(cx+dx,cy+dy);c.lineTo(cx+dy*w/L*2,cy-dx*w/L*2);c.fill()}c.restore();}},
{front(c,S,k){if(k>0.4&&S.t%28==0)S.p.push({ch:kanji[S.step%kanji.length],x:rnd(-0.6,0.6),y:rnd(0.9,1.6),z:RZ-0.2,a:0});
S.p=S.p.filter(p=>p.a<1&&p.z>1.3);for(const p of S.p){p.a+=1/50;p.z-=S.v*0.45;const[a,b]=P(p.x,p.y,p.z),s=F/p.z;c.save();c.globalAlpha=Math.min(1,p.a*6)*(1-p.a);c.fillStyle='#f2f4fa';
c.font='bold '+Math.floor(0.55*s)+'px "Yu Mincho","HG行書体","serif"';c.textAlign='center';c.translate(a,b);c.scale(1+p.a*0.6,1);c.fillText(p.ch,0,0);c.restore()}}},
{pre(S,k){F=260-70*k;S.shake=[rnd(-1,1)*k*1.5,rnd(-1,1)*k*1.5]},post(c,S,k){F=260;
c.strokeStyle='rgba(0,0,0,'+0.35*k+')';c.lineWidth=30;c.strokeRect(0,0,W,H)}},
{after(c,S,k){if(k<0.1)return;const [cx,cy]=P(0,1,RZ);if(Math.random()<0.6){for(let i=0;i<4;i++){const y=Math.floor(cy+rnd(-45,40)),h=Math.floor(rnd(2,8)),o=rnd(-10,10)*k;c.drawImage(c.canvas,cx-50,y,100,h,cx-50+o,y,100,h)}}
for(let i=0;i<3;i++){if(Math.random()<0.5)continue;c.fillStyle=Math.random()<0.5?'rgba(0,240,255,0.5)':'rgba(255,0,180,0.45)';c.fillRect(cx+rnd(-40,30),cy+rnd(-40,40),rnd(6,22),rnd(1,3))}}},
{back(c,S,k){if(k<0.05)return;oc.clearRect(0,0,W,H);for(let j=5;j>=1;j--)runner(oc,0,RZ-j*0.45,S.ph-j*0.9,'#59e6ff',(0.75-j*0.1)*k);
oc.globalCompositeOperation='destination-out';oc.fillStyle='#000';for(let y=(S.t%3);y<H;y+=3)oc.fillRect(0,y,W,1.6);oc.globalCompositeOperation='source-over';
c.save();c.globalCompositeOperation='lighter';c.drawImage(off,0,0);c.restore()}},
{back(c,S,k){if(k<0.05)return;c.save();c.globalCompositeOperation='lighter';c.lineCap='round';for(const fxp of[-0.15,0.15]){for(let i=0;i<24;i++){const z0=RZ-i*0.2,z1=z0-0.2;if(z1<1.3)break;const a=P(fxp+Math.sin(z0*2+S.dist*2)*0.02,0.01,z0),b=P(fxp+Math.sin(z1*2+S.dist*2)*0.02,0.01,z1);
const al=(1-i/24)*k;c.strokeStyle='rgba(60,170,255,'+al*0.35+')';c.lineWidth=0.12*F/z0;c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke();c.strokeStyle='rgba(220,245,255,'+al*0.9+')';c.lineWidth=Math.max(1,0.025*F/z0);c.stroke()}}c.restore()}},
{back(c,S,k){if(!S.l){S.l=[];for(let i=0;i<70;i++)S.l.push([rnd(-4,4),rnd(0,4),rnd(1.5,20)])}c.lineCap='round';
for(const d of S.l){d[2]-=S.v;if(d[2]<1.3){d[0]=rnd(-4,4);d[1]=rnd(0,4);d[2]=20}const L=S.v*8*k+0.02;const a=P(d[0],d[1],d[2]),b=P(d[0],d[1],d[2]+L);
c.strokeStyle='rgba(220,230,250,'+Math.min(0.7,1.8/d[2])+')';c.lineWidth=Math.max(1,0.03*F/d[2]);c.beginPath();c.moveTo(a[0],a[1]);c.lineTo(b[0],b[1]);c.stroke()}}},
{back(c,S,k){if(k<0.05)return;for(let j=10;j>=1;j--)runner(c,0,RZ-j*0.07*k,S.ph-j*0.08,'#0a0d18',0.12*k)}}];
const grid=document.getElementById('grid');
const scenes=ideas.map((d,i)=>{const w=document.createElement('div');
w.innerHTML='<canvas width="'+W+'" height="'+H+'"></canvas><div class="row"><span class="name">'+d[0]+'</span><button>▶ 最初から</button></div><div class="desc">'+d[1]+'</div>';
grid.appendChild(w);const S={i:i,c:w.querySelector('canvas').getContext('2d')};reset(S);
w.querySelector('button').addEventListener('click',()=>reset(S));w.querySelector('canvas').addEventListener('click',()=>reset(S));return S});
document.getElementById('all').addEventListener('click',()=>scenes.forEach(reset));
const autoBox=document.getElementById('auto');
function frame(S){const c=S.c;S.t++;
if(S.t>CYCLE){if(autoBox.checked){reset(S);S.t=1}else S.t=CYCLE+1}
const tt=Math.min(S.t,CYCLE);const k=tt<20?0:tt>CYCLE-50?Math.max(0,(CYCLE-20-tt)/30):Math.min(1,(tt-20)/ACC);
S.v=0.04+SP*k;S.dist+=S.v;const prev=Math.floor(S.ph/Math.PI);S.ph+=0.12+0.23*k;const step=Math.floor(S.ph/Math.PI)!==prev;if(step)S.step++;
const f=fx[S.i];S.shake=null;if(f.pre)f.pre(S,k);c.save();if(S.shake)c.translate(S.shake[0],S.shake[1]);
bg(c,S);if(f.back)f.back(c,S,k,step);runner(c,0,RZ,S.ph,DARK,1);if(f.front)f.front(c,S,k,step);c.restore();if(f.after)f.after(c,S,k,step);if(f.post)f.post(c,S,k);
c.fillStyle='rgba(255,255,255,0.55)';c.font='12px sans-serif';c.fillText(tt<20?'歩き':tt>CYCLE-50?'止まる':'ダッシュ',8,16)}
setInterval(()=>scenes.forEach(S=>{try{frame(S)}catch(e){F=260;console.error(S.i,e)}}),1000/60);
</script></body></html>
