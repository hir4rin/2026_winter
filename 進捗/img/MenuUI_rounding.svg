<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 230" font-family="Meiryo, 'Yu Gothic', sans-serif" font-size="13">
  <rect width="820" height="230" fill="#ffffff"/>
  <defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#000"/><stop offset="1" stop-color="#fff"/></linearGradient></defs>

  <text x="20" y="30" font-weight="bold" fill="#c0392b">書いていたもの</text>
  <text x="150" y="30" font-family="Consolas, monospace">[Math]::Max(0, [Math]::Min(1, x))</text>
  <text x="520" y="30" fill="#666" font-size="12">0 と 1 が整数なので、整数版が選ばれる</text>
  <rect x="150" y="44" width="500" height="44" fill="#000"/><rect x="400" y="44" width="250" height="44" fill="#fff" stroke="#000"/>
  <text x="664" y="71" font-size="12">黒か白の2段になる</text>

  <text x="20" y="130" font-weight="bold" fill="#3f8f68">直したもの</text>
  <text x="150" y="130" font-family="Consolas, monospace">[Math]::Max(0.0, [Math]::Min(1.0, x))</text>
  <text x="560" y="130" fill="#666" font-size="12">小数版が選ばれる</text>
  <rect x="150" y="144" width="500" height="44" fill="url(#g)" stroke="#000"/>
  <text x="664" y="171" font-size="12">なめらかにつながる</text>

  <text x="150" y="214" font-size="12" fill="#666">例: x = 0.55 が 1 に丸められていた。光・網点・周辺減光がこの影響を受けた。</text>
</svg>
