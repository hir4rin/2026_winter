// ---- 色を掛けた画像(SetDrawBright 相当)をキャッシュ ----
const tintCache = new Map();
function tinted(name, c) {
  const k = name + c.join(',');
  if (tintCache.has(k)) return tintCache.get(k);
  const src = img[name];
  const oc = document.createElement('canvas');
  oc.width = src.width; oc.height = src.height;
  const o = oc.getContext('2d');
  o.drawImage(src, 0, 0);
  o.globalCompositeOperation = 'multiply';
  o.fillStyle = rgb(c);
  o.fillRect(0, 0, oc.width, oc.height);
  o.globalCompositeOperation = 'destination-in';
  o.drawImage(src, 0, 0);
  tintCache.set(k, oc);
  return oc;
}

// DrawTiled 相当(u,v はタイル単位のずらし)
function drawTiled(name, x1, y1, x2, y2, tile, u, v, c, a, op = 'source-over') {
  const t = tinted(name, c);
  const p = ctx.createPattern(t, 'repeat');
  const s = tile / t.width;
  p.setTransform(new DOMMatrix().translate(x1 - u * tile, y1 - v * tile).scale(s));
  ctx.save();
  ctx.globalCompositeOperation = op;
  ctx.globalAlpha = a / 255;
  ctx.fillStyle = p;
  ctx.fillRect(x1, y1, x2 - x1, y2 - y1);
  ctx.restore();
}

// 9スライスの枠(frame9.png 48px 角16)
function drawFrame(x1, y1, x2, y2, c = RED, fill = 0) {
  if (fill > 0) {
    ctx.fillStyle = rgb([8, 3, 8], fill);
    ctx.fillRect(x1 + 4, y1 + 4, x2 - x1 - 8, y2 - y1 - 8);
  }
  const t = tinted('frame', c);
  const C = 16, S = 48;
  const xs = [x1, x1 + C, x2 - C, x2], ys = [y1, y1 + C, y2 - C, y2];
  const sp = [0, C, S - C], sl = [C, S - 2 * C, C];
  for (let iy = 0; iy < 3; iy++) for (let ix = 0; ix < 3; ix++) {
    if (ix === 1 && iy === 1) continue;
    ctx.drawImage(t, sp[ix], sp[iy], sl[ix], sl[iy], xs[ix], ys[iy], xs[ix + 1] - xs[ix], ys[iy + 1] - ys[iy]);
  }
}

function text(str, x, y, size, color, space = 0, align = 'left') {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.letterSpacing = space + 'px';
  ctx.textBaseline = 'top';
  ctx.textAlign = align;
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.letterSpacing = '0px';
  ctx.textAlign = 'left';
}

function wrapText(str, x, y, width, lh, size, color) {
  ctx.font = `bold ${size}px ${FONT}`;
  ctx.letterSpacing = '1px';
  let line = '', n = 0;
  for (const ch of str) {
    if (ctx.measureText(line + ch).width > width && line) {
      text(line, x, y + lh * n, size, color, 1); n++; line = ch;
    } else line += ch;
  }
  if (line) text(line, x, y + lh * n, size, color, 1);
  return n + 1;
}

// ---- 背景 ----
function drawGame(redTint, dark) {
  // EffectTools/StartLand/game_v2_tutorial.png の右下の1コマ(仮)
  ctx.save();
  ctx.filter = redTint ? 'grayscale(1) contrast(1.2) brightness(0.9)' : 'brightness(1)';
  ctx.drawImage(img.game, 0, 0, W, H);
  ctx.restore();
  if (redTint) {
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = rgb(RED);
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }
  ctx.fillStyle = `rgba(0,0,0,${dark})`;
  ctx.fillRect(0, 0, W, H);
}

function drawMenuBg(opaque, gridA, rainA) {
  if (opaque) { ctx.fillStyle = rgb(BG); ctx.fillRect(0, 0, W, H); }
  drawTiled('grid', 0, 0, W, H, 64, 0, 0, RED, gridA, 'lighter');
  drawTiled('rain', 0, 0, W, H, 256, 0, -frame * 0.004, RED, rainA, 'lighter');
  ctx.save();
  ctx.globalCompositeOperation = 'multiply';
  ctx.drawImage(img.vignette, 0, 0, W, H);
  ctx.restore();
}

// ---- タイトル ----
function drawTitle(title, x1 = 70, x2 = 1210, cxOverride) {
  const y = 40;
  ctx.drawImage(tinted('lineFade', RED), x1, y - 2, x2 - x1, 4);
  ctx.strokeStyle = rgb(RED); ctx.lineWidth = 1.2;
  for (const x of [x1, x2]) { ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.stroke(); }
  const cx = cxOverride ?? W / 2, d = 5;
  ctx.fillStyle = rgb(RED);
  ctx.beginPath(); ctx.moveTo(cx, y - d * 1.6); ctx.lineTo(cx + d, y); ctx.lineTo(cx, y + d * 1.6); ctx.lineTo(cx - d, y); ctx.fill();
  text(title, cx, 50, 22, rgb(RED), 6, 'center');
}

// ---- 一覧 ----
function drawSelectBar(x, y, w, h) {
  const t = Math.min(1, selectFrame / 10);
  const ease = 1 - Math.pow(1 - t, 3);
  const bw = w * ease;
  const flicker = (selectFrame < 4 && selectFrame % 2 === 1) ? 0.4 : 1;
  const pulse = 0.5 + 0.5 * Math.sin(frame * 0.08);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.globalAlpha = (35 + 30 * pulse) * flicker / 255;
  ctx.drawImage(tinted('glow', [RED[0], RED[1] >> 1, RED[2] >> 1]), x - 10, y - 8, bw + 20, h + 16);
  ctx.restore();
  if (bw > 1) {
    ctx.save();
    ctx.globalAlpha = 220 * flicker / 255;
    ctx.translate(x + bw, y); ctx.scale(-1, 1);   // 左が濃い向きに反転
    ctx.drawImage(tinted('selectBase', RED), 0, 0, bw, h);
    ctx.restore();
    drawTiled('halftone', x, y, x + bw, y + h, 6, 0, 0, [40, 0, 10], 90);
  }
  ctx.globalAlpha = flicker;
  ctx.fillStyle = 'rgb(255,90,110)';
  ctx.fillRect(x, y, 3, h);
  ctx.globalAlpha = 1;
}

function drawListPanel(x1, y1, x2, y2, header, fill) {
  drawFrame(x1, y1, x2, y2, RED, fill);
  const hy1 = y1 + 8, hy2 = y1 + 34;
  const ix1 = x1 + 8, ix2 = x1 + 34;
  ctx.strokeStyle = rgb(RED); ctx.lineWidth = 1;
  ctx.strokeRect(ix1 + 0.5, hy1 + 0.5, ix2 - ix1, hy2 - hy1);
  const cell = (ix2 - ix1) / 4;
  ctx.fillStyle = rgb(RED);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    if ((i * 3 + j * 5) % 3 === 0) continue;
    ctx.fillRect(ix1 + cell * i + 2, hy1 + cell * j + 2, cell - 3, cell - 3);
  }
  ctx.fillStyle = 'rgb(205,40,62)';
  ctx.fillRect(x1 + 39, hy1, x2 - 8 - (x1 + 39), hy2 - hy1);
  text(header, x1 + 53, hy1 + 4, 17, 'rgb(255,215,220)', 1);

  ITEMS.forEach((it, i) => {
    const y = y1 + 55 + 44 * i;
    if (i === cursor) drawSelectBar(x1 + 9, y, x2 - 5 - (x1 + 9), 36);
    else {
      ctx.globalAlpha = 200 / 255;
      ctx.drawImage(tinted('bracket', RED), x1 + 7, y, 12, 36);
      ctx.globalAlpha = 1;
    }
    text(it.name, x1 + 35, y + 6, 22, i === cursor ? 'rgb(255,236,238)' : rgb(RED), 3);
  });
  return y1 + 55 + 44 * ITEMS.length;
}

function headerLine(label, x1, y, x2) {
  text(label, x1, y, 17, rgb(RED), 1);
  ctx.font = `bold 17px ${FONT}`;
  const w = ctx.measureText(label).width + 8;
  ctx.strokeStyle = rgb(RED); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x1 + w, y + 10.5); ctx.lineTo(x2, y + 10.5); ctx.stroke();
  ctx.beginPath(); ctx.arc(x2, y + 10.5, 3.5, 0, Math.PI * 2); ctx.stroke();
}

function drawDetailPanel(x1, y1, x2, y2, fill) {
  drawFrame(x1, y1, x2, y2, RED, fill);
  const pad = 16, hx = x1 + pad;

  const it = ITEMS[cursor];
  text(it.name, hx + 8, y1 + 51, 22, 'rgb(255,236,238)', 3);
  ctx.drawImage(tinted('lineFade', RED), hx, y1 + 87, x2 - pad - hx, 3);
  wrapText(it.text, hx + 8, y1 + 105, x2 - x1 - pad * 2 - 16, 30, 17, 'rgb(220,150,160)');
}

function drawRecord(x1, y1, x2, y2, fill, compact = false) {

      text(k, hx + 8, y, 17, 'rgb(220,150,160)', 1);
      text(v, x2 - pad - 8, y - 2, 20, 'rgb(255,236,238)', 2, 'right');
    });
    return;
  }
  const colW = (x2 - x1 - pad * 2) / RECORD.length;
  RECORD.forEach(([k, v], i) => {
    const x = hx + colW * i + 8;
    text(k, x, y1 + 46, 17, 'rgb(220,150,160)', 1);
    text(v, x, y1 + 72, 22, 'rgb(255,236,238)', 2);
    if (i > 0) { ctx.fillStyle = rgb(RED, 0.35); ctx.fillRect(hx + colW * i - 4, y1 + 46, 1, 50); }
  });
}

function drawGuide(cx, lx1, lx2, bgFill) {
  const y = 676;
  if (lx2 > lx1) ctx.drawImage(tinted('lineFade', RED), lx1, y - 1, lx2 - lx1, 3);
  const ix = cx - 175, iy = y - 12;
  if (bgFill) { ctx.fillStyle = bgFill; ctx.fillRect(ix - 12, iy - 2, 362, 28); }
  ctx.drawImage(img.btnA, ix, iy, 24, 24);
  text('決定', ix + 30, iy + 2, 17, rgb(RED), 1);
  ctx.drawImage(img.btnB, ix + 95, iy, 24, 24);
  text('戻る', ix + 125, iy + 2, 17, rgb(RED), 1);
  text('↑↓ 選択', ix + 195, iy + 2, 17, rgb(RED), 1);
}

// ---- 開く演出(0.2秒: 横にずれて出る＋ちらつき) ----
function openState(delay) {
  const f = openFrame - delay;
  const t = Math.max(0, Math.min(1, f / 10));
  const ease = 1 - Math.pow(1 - t, 3);
  const flick = (f >= 0 && f < 5 && f % 2 === 1) ? 0.35 : 1;
  return { a: ease * flick, dx: (1 - ease) * -24 };
}
function withOpen(delay, fn, dir = 1) {
  const s = openState(delay);
  if (s.a <= 0) return;
  ctx.save();
  ctx.globalAlpha = s.a;
  ctx.translate(s.dx * dir, 0);
  fn();
  ctx.restore();
}

function draw() {
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  ctx.clearRect(0, 0, W, H);
  const v = VARIANTS[variant].key;
  const bgIn = Math.min(1, openFrame / 6);

  if (v === 'A') {
    drawGame(false, 0);
    ctx.globalAlpha = bgIn;
    drawMenuBg(true, 14, 170);
    ctx.globalAlpha = 1;
    withOpen(0, () => drawTitle('ポーズ'), 0);
    withOpen(2, () => drawListPanel(57, 117, 417, 623, 'メニュー', 0));
    withOpen(4, () => drawDetailPanel(460, 117, 1037, 373, 0), -1);
    withOpen(6, () => drawRecord(460, 393, 1037, 513, 0), -1);
    withOpen(6, () => drawGuide(W / 2, 380, 900, rgb(BG)), 0);
  } else if (v === 'B') {
    drawGame(false, 0);
    ctx.save(); ctx.globalAlpha = bgIn; drawGame(true, 0.45); ctx.restore();
    ctx.save(); ctx.globalAlpha = bgIn; drawMenuBg(false, 10, 110); ctx.restore();
    withOpen(0, () => drawTitle('ポーズ'), 0);
    withOpen(2, () => drawListPanel(57, 117, 417, 623, 'メニュー', 0.72));
    withOpen(4, () => drawDetailPanel(460, 117, 1037, 373, 0.72), -1);
    withOpen(6, () => drawRecord(460, 393, 1037, 513, 0.72), -1);
    withOpen(6, () => drawGuide(W / 2, 380, 900, 'rgba(10,4,8,0.85)'), 0);
  } else {
    drawGame(false, 0);
    // 左から右へ暗さが抜けるグラデーション
    ctx.save(); ctx.globalAlpha = bgIn;
    const g = ctx.createLinearGradient(0, 0, W, 0);
    g.addColorStop(0, 'rgba(10,4,8,0.92)'); g.addColorStop(0.38, 'rgba(10,4,8,0.80)'); g.addColorStop(0.62, 'rgba(10,4,8,0.35)'); g.addColorStop(1, 'rgba(10,4,8,0.45)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    drawTiled('rain', 0, 0, 520, H, 256, 0, -frame * 0.004, RED, 110, 'lighter');
    drawTiled('grid', 0, 0, 520, H, 64, 0, 0, RED, 10, 'lighter');
    ctx.restore();
    withOpen(0, () => drawTitle('ポーズ', 57, 417, 237), 0);
    withOpen(2, () => {
      const bottom = drawListPanel(57, 117, 417, 623, 'メニュー', 0.6);
      const y = bottom + 18;
      ctx.drawImage(tinted('lineFade', RED), 75, y, 324, 2);
      wrapText(ITEMS[cursor].text, 83, y + 18, 310, 28, 17, 'rgb(220,150,160)');
    });
    withOpen(5, () => drawRecord(1000, 40, 1222, 202, 0.6, true), -1);
    withOpen(6, () => drawGuide(237, 0, 0, null), 0);
  }
}

function tick() {
  const steps = slow ? (tick.n = (tick.n || 0) + 1, tick.n % 4 === 0 ? 1 : 0) : 1;
  for (let i = 0; i < steps; i++) { frame++; selectFrame++; openFrame++; }
  draw();
  requestAnimationFrame(tick);
}

// ---- UI ----
const tabs = document.getElementById('tabs');
VARIANTS.forEach((vv, i) => {
  const b = document.createElement('button');
  b.textContent = vv.label;
  b.onclick = () => { variant = i; openFrame = 0; refreshTabs(); };
  tabs.appendChild(b);
});
function refreshTabs() {
  [...tabs.children].forEach((b, i) => b.classList.toggle('on', i === variant));
  document.getElementById('desc').textContent = VARIANTS[variant].desc;
}
document.getElementById('replay').onclick = () => { openFrame = 0; };
document.getElementById('slow').onclick = (e) => { slow = !slow; e.target.textContent = '1/4の速さ: ' + (slow ? 'オン' : 'オフ'); };
cv.onclick = () => { openFrame = 0; };
addEventListener('keydown', (e) => {
  if (e.key === 'ArrowUp') { cursor = (cursor + ITEMS.length - 1) % ITEMS.length; selectFrame = 0; e.preventDefault(); }
  if (e.key === 'ArrowDown') { cursor = (cursor + 1) % ITEMS.length; selectFrame = 0; e.preventDefault(); }
  if (e.key === 'Enter') openFrame = 0;
  if (e.key === '1' || e.key === '2' || e.key === '3') { variant = +e.key - 1; openFrame = 0; refreshTabs(); }
});

const hash = location.hash.match(/v=(\d)/);
if (hash) variant = +hash[1];
refreshTabs();

Promise.all(Object.entries(SRC).map(([k, s]) => new Promise((res, rej) => {
  const im = new Image(); im.onload = () => { img[k] = im; res(); }; im.onerror = () => rej(s); im.src = s;
}))).then(() => requestAnimationFrame(tick)).catch((s) => {
  ctx.fillStyle = '#fff'; ctx.font = '20px sans-serif'; ctx.fillText('画像が読めません: ' + s, 20, 40);
});
</script>
