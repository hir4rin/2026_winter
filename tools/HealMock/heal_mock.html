<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>回復エフェクトモック</title>
<style>
:root{--bg:#141218;--fg:#e8e4dc;--sub:#a09aa8;--line:#3a3640;--sel:#c8b27a}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Gothic UI","Meiryo",sans-serif;padding:16px}
.wrap{max-width:1100px;margin:0 auto}
h1{font-size:18px;font-weight:500;margin:0 0 4px}
p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.7}
canvas{width:100%;display:block;border-radius:8px;background:#000}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--sub)}
button.on{border-color:var(--sel);color:var(--sel)}
label{font-size:13px;color:var(--sub)}
#desc{font-size:13px;color:var(--sub);line-height:1.8;min-height:72px;margin:6px 0 18px}
#desc b{color:var(--fg);font-weight:500}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:8px;padding:6px;cursor:pointer}
.card.on{border-color:var(--sel)}
.card div{font-size:13px;padding:6px 2px 2px}
</style>
</head>
<body>
<div class="wrap">
<h1>回復エフェクト(アイテムを使ったとき・プレイヤーにかかる)</h1>
<p>背景はゲームの画面(tools/LowHpMock/bg_game.jpg)。体の形はおおよそで切り抜いているので、体の後ろを通る物の隠れ方は目安。左上のバーは HP が増える時間の目安(ゲームの HUD ではない)。</p>

</div>
<div class="row" id="shapes"></div>
<div id="desc"></div>

 kikkou:{n:'亀甲(六角)',d:'六角形の光。亀甲は長寿の文様なので、和の「回復」の記号として使える。',f(x,s,P,a,k,i){x.save();x.rotate(k*.04+i);const r=s*1.1;glow(x,0,0,r*1.2,P.main,a*.35);x.strokeStyle=rgba(P.core,a);x.lineWidth=1.4;for(const rr of [r,r*.5]){x.beginPath();for(let j=0;j<6;j++){const an=j*Math.PI/3;j?x.lineTo(Math.cos(an)*rr,Math.sin(an)*rr):x.moveTo(rr,0)}x.closePath();x.stroke()}x.restore()}},
 halo:{n:'光の輪',d:'小さな光の輪が平たく昇っていく。輪が上へ抜ける=満たされて溢れる感じ。',f(x,s,P,a,k,i){const r=s*1.5;x.strokeStyle=rgba(P.core,a*.9);x.lineWidth=1.3;x.beginPath();x.ellipse(0,0,r,r*.3,0,0,7);x.stroke();glow(x,0,0,r,P.main,a*.25)}},

function rise(x,L,P,ps,t,cy,R,life,a){let i=0;for(const p of ps){i++;const k=t-p.d;if(k<0||k>life)continue;const back=Math.sin(p.a)<0;if(back!==(L==='back'))continue;
 const px=CX+Math.cos(p.a)*R*p.rr,py=cy+Math.sin(p.a)*R*p.rr*.27-k*p.v,al=(1-k/life)*a;
 if(shape==='dot')dot(x,px,py,p.s,P,al);else{x.save();x.translate(px,py);SYM[shape].f(x,p.s*4.5,P,al,k,i);x.restore()}}
 if(shape==='kanji'&&L==='front'&&t>18){const q=cl((t-18)/36),al=cl((t-18)/6)*(1-cl((t-40)/16))*a;if(al>0){x.save();x.font='bold 72px "Yu Mincho","Hiragino Mincho ProN",serif';x.textAlign='center';x.shadowColor=rgba(P.main,1);x.shadowBlur=18;x.fillStyle=rgba(P.core,al);x.fillText('癒',HEAD[0]-120,HEAD[1]+60-q*20);x.restore()}}}
function mkps(seed,n){const r=rnd(seed),ps=[];for(let i=0;i<n;i++)ps.push({a:r()*6.28,rr:.4+r()*.6,d:r()*30,v:2.5+r()*4.5,s:1+r()*1.4});return ps}

  ribbon(x,L,P,t,sm((t-10)/38)*1.6,.6,-2.2-.0,1.6,96,40,FY,TOP+10,11,fade,true);rise(x,L,P,ps,t-8,FY,90,40,fade);

   const bx=CX+Math.cos(ang)*78,by=FY+Math.sin(ang)*21,hh=(70+(i*37)%90)*eo(k),a=(1-cl((t-st-8)/22))*fade,g=x.createLinearGradient(0,by,0,by-hh);g.addColorStop(0,rgba(P.main,.5*a));g.addColorStop(1,rgba(P.main,0));
   x.strokeStyle=g;x.lineWidth=4+(i%3)*2;x.beginPath();x.moveTo(bx,by);x.lineTo(bx,by-hh);x.stroke()}}};}

  for(const p of ps){const kk=t-12-p.k0*32;if(kk<0||kk>24)continue;const back=Math.sin(p.a)<0;if(back!==(L==='back'))continue;const yy=FY-(FY-TOP+20)*sm(p.k0)-kk*p.v;dot(x,CX+Math.cos(p.a)*(96-36*p.k0),yy+Math.sin(p.a)*20,p.s,P,(1-kk/24))}
  if(t>42){const q=cl((t-42)/20);for(let i=0;i<16;i++){const ang=i/16*6.28,back=Math.sin(ang)<0;if(back!==(L==='back'))continue;dot(x,CX+Math.cos(ang)*(60+40*q),TOP-10+Math.sin(ang)*14-30*q,1.5,P,1-q)}}}};}
{const ps=mkps(27,34);

 d:'A の2本の帯を筆の線にした形(入りが太く、尾がかすれる)。足元の輪も筆の円相。<b>A の分かりやすさのまま、和の筆の見た目に寄せる</b>。',

 f(x,t,L,P){const fade=1-cl((t-50)/16);brushRing(x,L,P,CX,FY,92,eo(t/10),1-cl((t-30)/24));if(L==='back'){x.save();x.scale(1,.27);glow(x,CX,FY/.27,100,P.main,.3*cl(t/8)*(1-cl((t-30)/24)));x.restore()}
  const head=sm((t-4)/30)*1.5,sh=ei((t-22)/14);if(t<38)for(let j=0;j<2;j++)ribbon(x,L,P,t,head,.65,j*Math.PI,1.6,78*(1-sh),50*(1-sh)+2,FY,CHEST[1],11,1,true);

const KEYS=Object.keys(D);let cur='I';
const REST=40;
function hpBar(x,t,P){const a=.3,b=.75,k=eo((t-8)/30),v=a+(b-a)*k,X=40,Y=40,Wd=300;
x.fillStyle='rgba(0,0,0,.55)';x.fillRect(X-4,Y-4,Wd+8,18);x.fillStyle='rgb(60,14,22)';x.fillRect(X,Y,Wd,10);x.fillStyle='rgb(150,22,36)';x.fillRect(X,Y,Wd*a,10);
if(k>0){x.fillStyle=rgba(P.main,.8);x.fillRect(X+Wd*a,Y,Wd*(v-a),10);const f=1-cl((t-40)/20);x.fillStyle=`rgba(150,22,36,${1-f})`;x.fillRect(X+Wd*a,Y,Wd*(v-a),10);
 x.globalCompositeOperation='lighter';glow(x,X+Wd*v,Y+5,16,P.core,.8*f);x.globalCompositeOperation='source-over'}
x.fillStyle='rgba(255,255,255,.7)';x.font='12px sans-serif';x.textAlign='left';x.fillText('HP',X,Y+30)}
function render(cv,key,t,label){const x=cv.getContext('2d'),s=cv.width/W;x.setTransform(s,0,0,s,0,0);const P=PAL[pal],d=D[key];
x.globalCompositeOperation='source-over';if(bgOk)x.drawImage(bg,0,0,W,H);else{x.fillStyle='#223';x.fillRect(0,0,W,H)}
const dark=document.getElementById('dark').checked;if(dark){x.fillStyle='rgba(0,0,8,.6)';x.fillRect(0,0,W,H)}
const tt=t<d.len?t:-1;
if(tt>=0){x.save();x.globalCompositeOperation='lighter';d.f(x,tt,'back',P);x.restore();
 // 体を描き直して後ろの物を隠す
 x.save();bodyPath(x);x.clip();if(bgOk)x.drawImage(bg,0,0,W,H);if(dark){x.fillStyle='rgba(0,0,8,.6)';x.fillRect(0,0,W,H)}x.restore();
 x.save();x.globalCompositeOperation='lighter';if(document.getElementById('bodyGlow').checked&&d.flash[1])bodyFlash(x,P,.7*cl((tt-d.flash[0]+3)/3)*(1-cl((tt-d.flash[0])/d.flash[1])));d.f(x,tt,'front',P);x.restore()}
x.globalCompositeOperation='source-over';hpBar(x,tt<0?999:tt,P);
if(label){x.fillStyle='rgba(255,255,255,.8)';x.font='14px sans-serif';x.textAlign='right';x.fillText(`${Math.max(0,Math.round(t))}F / ${(t/60).toFixed(2)}秒(全体 ${d.len}F)`,W-14,H-14)}}

[...gz.children].forEach(c=>c.classList.toggle('on',c.dataset.k===cur));document.getElementById('desc').innerHTML=`<b>${D[cur].n}</b><br>${D[cur].d}`}
KEYS.forEach(k=>{const b=document.createElement('button');b.textContent=D[k].n;b.dataset.k=k;b.onclick=()=>{cur=k;tb=0;sync()};dz.appendChild(b);
const c=document.createElement('div');c.className='card';c.dataset.k=k;const cv=document.createElement('canvas');cv.width=489;cv.height=275;c.appendChild(cv);const l=document.createElement('div');l.textContent=D[k].n;c.appendChild(l);c.onclick=()=>{cur=k;tb=0;sync();window.scrollTo({top:0,behavior:'smooth'})};gz.appendChild(c);small[k]=cv});
Object.keys(PAL).forEach(k=>{const b=document.createElement('button');b.textContent='色: '+PAL[k].n;b.dataset.k=k;b.style.borderLeft=`6px solid ${rgba(PAL[k].main,1)}`;b.onclick=()=>{pal=k;sync()};cz.appendChild(b)});

{const sz=document.getElementById('shapes'),lab=document.createElement('span');lab.style.cssText='font-size:13px;color:var(--sub);width:100%';
