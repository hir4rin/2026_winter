<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>弱スキルの連鎖 比較</title>
<style>
  :root{--bg:#0b0607;--panel:#160c0e;--line:#3a1c22;--text:#e8e2de;--sub:#9c8a88;--red:#d8283c}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif;font-size:14px}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  h1{font-size:16px;margin:0 12px 0 0;font-weight:600}
  button,select{background:var(--panel);color:var(--text);border:1px solid var(--line);padding:6px 10px;border-radius:4px;font:inherit;cursor:pointer}
  button.on{border-color:var(--red);background:#3a0d16}
  .wrap{padding:12px 16px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:0 0 10px}
  input[type=range]{width:320px;max-width:100%}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:10px}
  .cell{background:var(--panel);border:1px solid var(--line);border-radius:4px;overflow:hidden}
  .cell canvas{width:100%;display:block;background:#000}
  .cap{padding:6px 10px;line-height:1.6}
  .cap b{color:#ff8a95}
  .sub{color:var(--sub)}
</style>
</head>
<body>
<header>
  <h1>弱スキルの連鎖 比較</h1>
  <span id="viewBtns"></span>
  <button id="playBtn">停止</button>
  <button id="prevBtn">◀ 1F</button>
  <button id="nextBtn">1F ▶</button>
  <select id="speed"><option value="1">×1</option><option value="0.5">×0.5</option><option value="0.25">×0.25</option></select>
</header>
<div class="wrap">
  <div class="row"><input type="range" id="seek" min="0" max="89" value="0"><span id="frameText" class="sub"></span>
    <span class="sub">赤い柱=敵(プレイヤーの前)。フレームは60fps。<code>#all,40</code> でそのフレームに止まる。</span></div>
  <div id="grid"></div>
</div>
<script>
const LOOP = 90;           // 1回分の長さ(F)
const ENEMY_Y = 4.5;       // 敵の胸の高さ(エフェクトの単位)
const PLAYER = [0, 0, -5]; // 分身が走り出す所

// 段の決まり。legs: 敵を通る斬撃の線
const PLANS = [
  { key:'now', name:'今(弱1 v5)', note:'水平の直線が4本。3Fおき。', build:()=>buildLegs({ n:4, gap:3, pitch:()=>rnd(-12,12), bend:0 }) },
  { key:'A', name:'A 立体的に斬る', note:'斬る線を上下に傾け、少し曲げる。どの向きから見ても別の向きの線が重なる。', build:()=>buildLegs({ n:4, gap:3, pitch:i=>(i%2?1:-1)*rnd(30,55), bend:3 }) },
  { key:'B', name:'B 段ごとに斬る面を変える', note:'弱1=水平 → 弱2=斜めのX → 弱3=縦。段が進むほど斬る面が立つ。', build:buildStepPlanes, steps:true },
  { key:'C', name:'C 止めてから斬る(居合)', note:'分身が敵の周りに現れて止まり、少し後に全部の線がまとめて走る。', build:buildIai },
  { key:'D', name:'D 一撃ごとにアクセント', note:'今の連鎖に、当たるたびの白い線と小さな閃光を足す。', build:()=>buildLegs({ n:4, gap:3, pitch:()=>rnd(-12,12), bend:0, accent:true }) },
  { key:'AD', name:'A＋D(おすすめ)', note:'立体的な線＋一撃ごとの白い線と閃光。', build:()=>buildLegs({ n:4, gap:3, pitch:i=>(i%2?1:-1)*rnd(30,55), bend:3, accent:true }) },
];
const VIEWS = [
  { key:'diag', name:'斜め', yaw:-0.95, pitch:0.38 },
  { key:'game', name:'ゲームの後ろ', yaw:Math.PI, pitch:0.22 },
  { key:'top', name:'真上', yaw:Math.PI, pitch:1.45 },
  { key:'side', name:'真横', yaw:-Math.PI/2, pitch:0.03 },
];

let seed = 7;
function rnd(a, b){ seed = (seed * 16807) % 2147483647; return a + (b - a) * (seed / 2147483647); }

// 敵の胸を通る線。yaw は星形に散らす
function legLine(yawDeg, pitchDeg, len){
  const y = yawDeg * Math.PI / 180, p = pitchDeg * Math.PI / 180;
  const d = [Math.sin(y) * Math.cos(p), Math.sin(p), Math.cos(y) * Math.cos(p)];
  const c = [0, ENEMY_Y, 0];
  return { p0:[c[0]-d[0]*len, c[1]-d[1]*len, c[2]-d[2]*len], p1:[c[0]+d[0]*len, c[1]+d[1]*len, c[2]+d[2]*len], dir:d };
}
function bendCtrl(l, amount){
  // 線に垂直で、上向き寄りの方向へふくらませる
  const up = [0,1,0], d = l.dir;
  let s = [d[1]*up[2]-d[2]*up[1], d[2]*up[0]-d[0]*up[2], d[0]*up[1]-d[1]*up[0]];
  const m = Math.hypot(...s) || 1; s = s.map(v=>v/m);
  const mid = l.p0.map((v,i)=>(v + l.p1[i]) / 2);
  return mid.map((v,i)=>v + s[i]*amount);
}
function dashIn(){ return { t0:2, dur:6, p0:PLAYER, p1:[0, 0, -1], ctrl:null, ghostOnly:true }; }

function buildLegs(o){
  seed = 7;
  const legs = [dashIn()];
  for (let i = 0; i < o.n; i++){
    const yaw = i * (180 / o.n) + rnd(-15, 15) + 20;
    const l = legLine(yaw, o.pitch(i), 10);
    legs.push({ t0:9 + i*o.gap, dur:4, p0:l.p0, p1:l.p1, ctrl:o.bend ? bendCtrl(l, o.bend * (i%2?1:-1)) : null, accent:o.accent });
  }
  return { legs, end:9 + o.n*o.gap + 4 };
}
function buildStepPlanes(){
  seed = 11;
  const legs = [];
  const steps = [
    { t:0,  label:'弱1 水平', pitch:()=>rnd(-8,8), n:4 },
    { t:30, label:'弱2 斜めのX', pitch:i=>(i%2?1:-1)*40, n:4 },
    { t:60, label:'弱3 縦', pitch:()=>rnd(70,85), n:3 },
  ];
  const labels = [];
  for (const s of steps){
    labels.push({ t:s.t, label:s.label });
    for (let i = 0; i < s.n; i++){
      const l = legLine(i * (180/s.n) + 25, s.pitch(i), 10);
      legs.push({ t0:s.t + 4 + i*3, dur:4, p0:l.p0, p1:l.p1, ctrl:null, accent:true });
    }
  }
  return { legs, labels, end:LOOP };
}
function buildIai(){
  seed = 5;
  const legs = [dashIn()];
  const poses = [];
  const n = 5;
  for (let i = 0; i < n; i++){
    const l = legLine(i * (180/n) + 15, (i%2?1:-1)*rnd(15,50), 10);
    poses.push({ t0:9 + i*3, pos:l.p1, dir:l.dir });
    // 36Fでまとめて線が走る
    legs.push({ t0:36, dur:2, p0:l.p0, p1:l.p1, ctrl:null, accent:true, lineOnly:true });
  }
  return { legs, poses, burst:37, end:60 };
}

// --- 描画 ---
function project(p, cam, w, h){
  const [x,y,z] = [p[0]-cam.fx, p[1]-cam.fy, p[2]-cam.fz];
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const x1 = x*cy - z*sy, z1 = x*sy + z*cy;
  const y2 = y*cp - z1*sp, z2 = y*sp + z1*cp;
  const depth = z2 + cam.dist;
  const f = h * 1.15 / depth;
  return [w/2 + x1*f, h*0.58 - y2*f, depth, f];
}
function bez(l, u){
  if (!l.ctrl) return l.p0.map((v,i)=>v + (l.p1[i]-v)*u);
  const a = (1-u)*(1-u), b = 2*(1-u)*u, c = u*u;
  return l.p0.map((v,i)=>a*v + b*l.ctrl[i] + c*l.p1[i]);
}
function ease(u){ return 1 - Math.pow(1-u, 2); }

function drawGround(g, cam, w, h){
  g.strokeStyle = 'rgba(140,110,110,0.18)'; g.lineWidth = 1;
  for (let r = 4; r <= 16; r += 4){
    g.beginPath();
    for (let a = 0; a <= 64; a++){
      const t = a / 64 * Math.PI * 2, q = project([Math.cos(t)*r, 0, Math.sin(t)*r], cam, w, h);
      a ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]);
    }
    g.stroke();
  }
}
function drawEnemy(g, cam, w, h){
  const b = project([0,0,0], cam, w, h), t = project([0,12,0], cam, w, h);
  g.strokeStyle = 'rgba(150,40,52,0.6)'; g.lineWidth = Math.max(5, 2.2 * b[3]); g.lineCap = 'round';
  g.beginPath(); g.moveTo(b[0], b[1]); g.lineTo(t[0], t[1]); g.stroke();
}
// 分身: 進む向きに伸びた白い人影(頭と体)
function drawGhost(g, cam, w, h, pos, dir, alpha){
  const a = project(pos, cam, w, h);
  const tip = project(pos.map((v,i)=>v + dir[i]*2.2 + (i==1?0.3:0)), cam, w, h);
  const tail = project(pos.map((v,i)=>v - dir[i]*2.5 + (i==1?0.3:0)), cam, w, h);
  g.save(); g.globalAlpha = alpha; g.strokeStyle = '#f4f6ff'; g.fillStyle = '#f4f6ff';
  g.lineCap = 'round'; g.lineWidth = Math.max(3, 1.3 * a[3]);
  g.beginPath(); g.moveTo(tail[0], tail[1]); g.lineTo(tip[0], tip[1]); g.stroke();
  g.beginPath(); g.arc(tip[0], tip[1], Math.max(2.5, 0.9 * a[3]), 0, Math.PI*2); g.fill();
  g.restore();
}
function drawTrail(g, cam, w, h, l, uFrom, uTo, alpha, width, color){
  if (uTo <= uFrom || alpha <= 0) return;
  g.save(); g.lineCap = 'round';
  const N = 14;
  for (let k = 0; k < N; k++){
    const u0 = uFrom + (uTo-uFrom)*k/N, u1 = uFrom + (uTo-uFrom)*(k+1)/N;
    const a = project(bez(l,u0), cam, w, h), b = project(bez(l,u1), cam, w, h);
    g.globalAlpha = alpha * ((k+1)/N);
    g.strokeStyle = color; g.lineWidth = Math.max(1, width * a[3] * ((k+1)/N));
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  g.restore();
}
function drawFlash(g, cam, w, h, pos, s, alpha){
  const a = project(pos, cam, w, h), r = s * a[3];
  g.save(); g.globalCompositeOperation = 'lighter'; g.globalAlpha = alpha;
  const gr = g.createRadialGradient(a[0], a[1], 0, a[0], a[1], r);
  gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(0.3, 'rgba(200,220,255,0.6)'); gr.addColorStop(1, 'rgba(120,160,255,0)');
  g.fillStyle = gr; g.beginPath(); g.arc(a[0], a[1], r, 0, Math.PI*2); g.fill();
  g.strokeStyle = 'rgba(255,255,255,0.9)'; g.lineWidth = 1.5;
  for (let i = 0; i < 6; i++){
    const t = i/6*Math.PI + 0.3;
    g.beginPath(); g.moveTo(a[0]-Math.cos(t)*r*1.6, a[1]-Math.sin(t)*r*1.6); g.lineTo(a[0]+Math.cos(t)*r*1.6, a[1]+Math.sin(t)*r*1.6); g.stroke();
  }
  g.restore();
}

function drawPlan(g, plan, data, f, view){
  const w = g.canvas.width, h = g.canvas.height;
  g.fillStyle = '#07090f'; g.fillRect(0, 0, w, h);
  const cam = { yaw:view.yaw, pitch:view.pitch, dist:32, fx:0, fy:4.5, fz:0 };
  drawGround(g, cam, w, h);
  drawEnemy(g, cam, w, h);

  // 置いて止まる分身(C)
  if (data.poses){
    for (const p of data.poses){
      if (f < p.t0 || f >= 37) continue;
      const k = Math.min(1, (f - p.t0) / 3);
      drawGhost(g, cam, w, h, p.pos, p.dir.map(v=>-v), 0.9 * k);
    }
  }
  for (const l of data.legs){
    const t = f - l.t0;
    if (t < 0) continue;
    const u = Math.min(1, t / l.dur), eu = ease(u);
    const dir = (()=>{ const a = bez(l, Math.max(0, eu-0.05)), b = bez(l, Math.min(1, eu+0.05)); const d = b.map((v,i)=>v-a[i]); const m = Math.hypot(...d)||1; return d.map(v=>v/m); })();
    const fade = u < 1 ? 1 : Math.max(0, 1 - (t - l.dur) / 12);
    if (!l.lineOnly){
      // 風の帯(白青)
      drawTrail(g, cam, w, h, l, Math.max(0, eu - 0.7), eu, 0.55 * fade, 0.9, '#a9c4ff');
      if (u < 1 || t < l.dur + 3){
        for (let k = 3; k >= 0; k--){
          const uu = Math.max(0, eu - k*0.12);
          drawGhost(g, cam, w, h, bez(l, uu), dir, (u < 1 ? 1 : Math.max(0, 1-(t-l.dur)/3)) * (1 - k*0.22));
        }
      }
    }
    if (l.ghostOnly) continue;
    // アクセント: 白い線と閃光(敵を通った瞬間)
    if (l.accent){
      const hitT = l.lineOnly ? 0 : l.dur * 0.5;
      const ht = t - hitT;
      if (ht >= 0 && ht < 10){
        const a = 1 - ht / 10;
        drawTrail(g, cam, w, h, l, 0, Math.min(1, (ht+1)/2), a, 0.35, '#ffffff');
        if (ht < 6) drawFlash(g, cam, w, h, [0, ENEMY_Y, 0], 1.6 * (1 - ht/6) + 0.6, a);
      }
    }
  }
  if (data.burst !== undefined){
    const bt = f - data.burst;
    if (bt >= 0 && bt < 14) drawFlash(g, cam, w, h, [0, ENEMY_Y, 0], 3 + bt*0.4, 1 - bt/14);
  }
  // 文字
  g.fillStyle = '#e8e2de'; g.font = '600 18px "Yu Gothic UI",sans-serif';
  g.fillText(plan.name, 14, 28);
  g.font = '14px "Yu Gothic UI",sans-serif'; g.fillStyle = '#9c8a88';
  g.fillText(`${Math.floor(f)}F`, w - 50, 28);
  if (data.labels){
    let cur = data.labels[0].label; for (const lb of data.labels) if (f >= lb.t) cur = lb.label;
    g.fillStyle = '#ff8a95'; g.fillText(cur, 14, 50);
  }
}

// --- 画面 ---
const grid = document.getElementById('grid');
const cells = PLANS.map(p=>{
  const div = document.createElement('div'); div.className = 'cell';
  const c = document.createElement('canvas'); c.width = 640; c.height = 400;
  const cap = document.createElement('div'); cap.className = 'cap'; cap.innerHTML = `<b>${p.name}</b><br><span class="sub">${p.note}</span>`;
  div.append(c, cap); grid.append(div);
  return { plan:p, g:c.getContext('2d'), data:p.build() };
});
let view = VIEWS[0], frame = 0, playing = true;
const hash = location.hash.slice(1).split(',');
if (hash.length >= 2){ frame = +hash[1]; playing = false; const v = VIEWS.find(x=>x.key === hash[2]); if (v) view = v; }
const viewBtns = document.getElementById('viewBtns');
for (const v of VIEWS){
  const b = document.createElement('button'); b.textContent = v.name;
  b.onclick = ()=>{ view = v; [...viewBtns.children].forEach(x=>x.classList.toggle('on', x===b)); draw(); };
  if (v === view) b.classList.add('on');
  viewBtns.append(b);
}
const seek = document.getElementById('seek'), ft = document.getElementById('frameText');
function draw(){ for (const c of cells) drawPlan(c.g, c.plan, c.data, frame, view); seek.value = Math.floor(frame); ft.textContent = `${Math.floor(frame)} / ${LOOP-1}F`; }
document.getElementById('playBtn').onclick = e=>{ playing = !playing; e.target.textContent = playing ? '停止' : '再生'; };
document.getElementById('prevBtn').onclick = ()=>{ playing = false; frame = (Math.floor(frame) - 1 + LOOP) % LOOP; draw(); };
document.getElementById('nextBtn').onclick = ()=>{ playing = false; frame = (Math.floor(frame) + 1) % LOOP; draw(); };
seek.oninput = ()=>{ playing = false; frame = +seek.value; draw(); };
let last = performance.now();
function tick(now){
  const dt = (now - last) / (1000/60); last = now;
  if (playing){ frame = (frame + dt * +document.getElementById('speed').value) % LOOP; }
  draw(); requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
