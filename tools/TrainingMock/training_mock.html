<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーニングルームモック</title>
<style>
  :root { --bg:#0b060c; --fg:#f2dde0; --red:#e62d46; --dim:#9a6a72; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:"游ゴシック","Yu Gothic",sans-serif; }
  .wrap { max-width:1280px; margin:0 auto; padding:16px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p.note { margin:0 0 10px; color:var(--dim); font-size:13px; line-height:1.6; }
  .row { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; align-items:center; font-size:13px; }
  .row .lbl { color:var(--dim); width:64px; flex:none; }
  button { background:#1a0d12; color:var(--fg); border:1px solid #5a2430; padding:5px 10px; cursor:pointer; font-size:13px; }
  button.on { background:var(--red); border-color:var(--red); color:#fff; }
  canvas { width:100%; height:auto; display:block; background:#000; outline:1px solid #3a1820; }
  .desc { font-size:13px; line-height:1.7; color:#d8c0c4; background:#140a0e; border-left:3px solid var(--red); padding:8px 12px; margin-top:10px; }
  .desc b { color:#fff; }
  code { color:#f0a0ac; }
</style>
</head>
<body>
<div class="wrap">
  <h1>トレーニングルームの案(四角い部屋 ＋ 格ゲーの設定)</h1>
  <p class="note">「部屋の配置」は真上から見た図です。白い点は壁走りと壁キックのお手本の動きです。右下の図は南から見た高さです。<br>
  「設定メニュー」は ↑↓ で選ぶ、←→ で変える、Enter で実行、Esc(Tab)で閉じる/開く。クリックでも操作できます。後ろのゲーム画面は設定に合わせて動きます。<br>
  URL の <code>#room,120</code>(画面,フレーム)、<code>#menu</code>、<code>#game</code> でその画面を開けます。</p>
  <div class="row"><span class="lbl">画面</span>
    <button data-m="room">部屋の配置</button>
    <button data-m="menu">設定メニュー</button>
    <button data-m="game">メニューを閉じた画面</button>
  </div>
  <div class="row"><span class="lbl">再生</span>
    <button id="pause">止める</button>
    <button id="slow">1/4の速さ: オフ</button>
  </div>
  <canvas id="cv" width="1280" height="720"></canvas>
  <div class="desc" id="desc"></div>
</div>
<script>
const W = 1280, H = 720;
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const RED = '#e62d46';
const MIN = '"游明朝","Yu Mincho",serif';
const GOT = '"游ゴシック","Yu Gothic",sans-serif';
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, t) => a + (b - a) * t;

// ---------------------------------------------------------------- 部屋の配置
const ACT = {
  run:   { name:'走る',     col:'#bfb0b4' },
  jump:  { name:'ジャンプ', col:'#ffffff' },
  wrun:  { name:'壁走り',   col:'#e62d46' },
  wkick: { name:'壁キック', col:'#ff9a3c' },
  drop:  { name:'落下攻撃', col:'#c07cff' },
  fight: { name:'戦う',     col:'#ffd84a' },
};
const ENEMY = { sword:{ ch:'刀', col:'#d65a6a' }, gun:{ ch:'銃', col:'#5aa8d6' }, bazooka:{ ch:'砲', col:'#d6a05a' } };

// 単位はメートル。四角い部屋。route は [x, y, 高さ, この点から次の点への動き]
const ROOM = {
  name:'四角い部屋', w:40, h:40,
  zones:[
    { x:0, y:4, w:6, h:30, label:'壁走りゾーン', col:'rgba(230,45,70,0.12)', tc:'#ff7a8a' },
    { x:32, y:0, w:8, h:13, label:'壁キックで登る', col:'rgba(255,154,60,0.12)', tc:'#ffb070' },
    { x:10, y:12, w:20, h:20, label:'広場(敵を出す)', col:'rgba(255,255,255,0.035)', tc:'rgba(242,221,224,0.6)' },
  ],
  plats:[ { x:14, y:0, w:20, h:4, hgt:10, label:'上の足場 10m' } ],
  walls:[
    [0,0,40,0,'n'], [40,0,40,40,'n'], [40,40,0,40,'n'], [0,40,0,34,'n'], [0,34,0,4,'run'], [0,4,0,0,'n'],
    [34,0,34,10,'kick'], [37,0,37,10,'kick'],
  ],
  enemies:[ [16,20,'sword'],[24,20,'sword'],[20,25,'gun'] ],
  start:[20,37],
  notes:[ [35.5,11.6,'入口'] ],
  demos:[
    [[4,37,0,'jump'],[0.7,33,2,'wrun'],[0.7,6,3.2,'jump'],[4,2.5,0,'run'],[4,2.5,0,'']],
    [[35.5,15,0,'run'],[35.5,10,0,'wkick'],[34.6,8.8,2.5,'wkick'],[36.4,7.2,5,'wkick'],[34.6,5.6,7.5,'wkick'],[36.4,4,10,'jump'],[33,2,10,'run'],[24,2,10,'drop'],[20,18,0,'']],
  ],
};
const SPEED = 0.2, HOLD = 50;
ROOM.demos = ROOM.demos.map(route => {
  let L = 0; const seg = [];
  for (let i = 0; i < route.length - 1; i++) {
    const a = route[i], b = route[i + 1];
    const d = Math.hypot(b[0] - a[0], b[1] - a[1], b[2] - a[2]);
    if (d > 0) { seg.push({ a, b, L0:L, d }); L += d; }
  }
  return { route, seg, len:L, T:Math.round(L / SPEED) + HOLD };
});
function sampleDemo(dm, f) {
  const t = Math.min((f % dm.T) * SPEED, dm.len);
  for (const s of dm.seg) {
    if (t <= s.L0 + s.d) {
      const u = (t - s.L0) / s.d;
      let h = lerp(s.a[2], s.b[2], u);
      if (s.a[3] === 'jump' || s.a[3] === 'drop') h += Math.sin(u * Math.PI) * (s.a[3] === 'drop' ? 2.5 : 1.2);
      return { x:lerp(s.a[0], s.b[0], u), y:lerp(s.a[1], s.b[1], u), h, act:s.a[3] };
    }
  }
  const e = dm.route[dm.route.length - 1];
  return { x:e[0], y:e[1], h:e[2], act: dm === ROOM.demos[1] ? 'fight' : 'run' };
}

function drawRoomMap(rx, ry, rw, rh, f) {
  const p = ROOM, pad = 20;
  const s = Math.min((rw - pad * 2) / p.w, (rh - pad * 2) / p.h);
  const ox = rx + (rw - p.w * s) / 2, oy = ry + (rh - p.h * s) / 2;
  const X = x => ox + x * s, Y = y => oy + y * s;
  ctx.save();
  ctx.fillStyle = '#160c11'; ctx.fillRect(X(0), Y(0), p.w * s, p.h * s);
  ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
  for (let x = 0; x <= p.w; x += 2) { ctx.beginPath(); ctx.moveTo(X(x), Y(0)); ctx.lineTo(X(x), Y(p.h)); ctx.stroke(); }
  for (let y = 0; y <= p.h; y += 2) { ctx.beginPath(); ctx.moveTo(X(0), Y(y)); ctx.lineTo(X(p.w), Y(y)); ctx.stroke(); }
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  for (const z of p.zones) {
    ctx.fillStyle = z.col; ctx.fillRect(X(z.x), Y(z.y), z.w * s, z.h * s);
  }
  for (const q of p.plats) {
    ctx.fillStyle = 'rgba(180,150,160,0.3)'; ctx.fillRect(X(q.x), Y(q.y), q.w * s, q.h * s);
    ctx.strokeStyle = 'rgba(220,200,205,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(X(q.x), Y(q.y), q.w * s, q.h * s);
    ctx.fillStyle = '#f2dde0'; ctx.font = `13px ${GOT}`; ctx.fillText(q.label, X(q.x) + 6, Y(q.y) + 4);
  }
  for (const w of p.walls) {
    const [x1, y1, x2, y2, t] = w;
    if (t === 'run') {
      ctx.strokeStyle = RED; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    } else if (t === 'kick') {
      ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 6; ctx.setLineDash([5, 4]);
      ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke(); ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = '#7a5a62'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(X(x1), Y(y1)); ctx.lineTo(X(x2), Y(y2)); ctx.stroke();
    }
  }
  // ゾーンの名前
  for (const z of p.zones) {
    ctx.fillStyle = z.tc; ctx.font = `bold 15px ${GOT}`;
    if (z.label === '壁走りゾーン') {
      ctx.save(); ctx.translate(X(z.x + z.w) - 4, Y(z.y + z.h / 2)); ctx.rotate(-Math.PI / 2); ctx.textAlign = 'center';
      ctx.fillText('壁走りゾーン(西の壁 30m)', 0, -18); ctx.restore();
    } else if (z.label === '壁キックで登る') {
      ctx.textAlign = 'center'; ctx.fillText('壁キック', X(z.x + z.w / 2), Y(z.y + z.h) + 4);
      ctx.font = `12px ${GOT}`; ctx.fillText('幅3m・高さ10m', X(z.x + z.w / 2), Y(z.y + z.h) + 24); ctx.textAlign = 'left';
    } else {
      ctx.fillText(z.label, X(z.x) + 8, Y(z.y + z.h) - 24);
    }
  }
  for (const n of p.notes) {
    ctx.fillStyle = '#ffb070'; ctx.font = `12px ${GOT}`; ctx.textAlign = 'center';
    ctx.fillText('↑' + n[2], X(n[0]), Y(n[1]) + 18); ctx.textAlign = 'left';
  }
  for (const e of p.enemies) {
    const d = ENEMY[e[2]], r = 0.9 * s;
    ctx.fillStyle = d.col; ctx.beginPath(); ctx.arc(X(e[0]), Y(e[1]), r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#100'; ctx.font = `bold ${Math.round(r * 1.2)}px ${MIN}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(d.ch, X(e[0]), Y(e[1]) + 1); ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  }
  ctx.fillStyle = '#fff'; ctx.font = `bold 14px ${GOT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(X(p.start[0]), Y(p.start[1]), 12, 0, Math.PI * 2); ctx.stroke();
  ctx.fillText('S', X(p.start[0]), Y(p.start[1]) + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  // お手本の動き
  for (const dm of p.demos) {
    ctx.lineWidth = 2; ctx.globalAlpha = 0.4; ctx.setLineDash([3, 4]);
    for (const sg of dm.seg) { ctx.strokeStyle = ACT[sg.a[3]].col; ctx.beginPath(); ctx.moveTo(X(sg.a[0]), Y(sg.a[1])); ctx.lineTo(X(sg.b[0]), Y(sg.b[1])); ctx.stroke(); }
    ctx.setLineDash([]); ctx.globalAlpha = 1;
    for (let k = 24; k >= 3; k -= 3) {
      if ((f % dm.T) - k < 0) continue;
      const g = sampleDemo(dm, f - k);
      ctx.fillStyle = ACT[g.act].col; ctx.globalAlpha = (1 - k / 27) * 0.5;
      ctx.beginPath(); ctx.arc(X(g.x), Y(g.y) - g.h * 1.5, 4 + g.h * 0.35, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const g = sampleDemo(dm, f);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(X(g.x), Y(g.y) + 3, 7, 3, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(g.x), Y(g.y) - g.h * 1.5, 7 + g.h * 0.35, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ACT[g.act].col; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = ACT[g.act].col; ctx.font = `bold 13px ${GOT}`;
    ctx.fillText(ACT[g.act].name, X(g.x) + 14, Y(g.y) - g.h * 1.5 - 8);
  }
  ctx.restore();
}

// 南から見た図(高さ)
function drawSideView(rx, ry, rw, rh, f) {
  const p = ROOM;
  ctx.fillStyle = '#120a0e'; ctx.fillRect(rx, ry, rw, rh);
  ctx.strokeStyle = '#3a1820'; ctx.lineWidth = 1; ctx.strokeRect(rx, ry, rw, rh);
  ctx.fillStyle = '#9a6a72'; ctx.font = `12px ${GOT}`; ctx.fillText('南から見た図(高さ)', rx + 8, ry + 6);
  const px = rx + 34, pw = rw - 50, py = ry + 30, ph = rh - 50, MAXH = 12;
  const X = x => px + x / p.w * pw, Y = h => py + ph - h / MAXH * ph;
  ctx.fillStyle = '#6a5a5e'; ctx.font = `10px ${GOT}`;
  for (let h = 0; h <= MAXH; h += 4) {
    ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.beginPath(); ctx.moveTo(px, Y(h)); ctx.lineTo(px + pw, Y(h)); ctx.stroke();
    ctx.fillText(h + 'm', rx + 6, Y(h) - 6);
  }
  // 床・壁
  ctx.strokeStyle = '#7a5a62'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(40), Y(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(X(40), Y(0)); ctx.lineTo(X(40), Y(12)); ctx.stroke();
  ctx.strokeStyle = RED; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(X(0), Y(0)); ctx.lineTo(X(0), Y(12)); ctx.stroke();
  ctx.fillStyle = 'rgba(230,45,70,0.25)'; ctx.fillRect(X(0), Y(4), 8, Y(1.5) - Y(4));
  ctx.fillStyle = '#ff7a8a'; ctx.font = `11px ${GOT}`; ctx.fillText('壁走りの高さ', X(0) + 12, Y(4) - 2);
  ctx.fillStyle = 'rgba(180,150,160,0.35)'; ctx.fillRect(X(14), Y(10), X(34) - X(14), 6);
  ctx.fillStyle = '#d8c0c4'; ctx.fillText('上の足場', X(18), Y(10) - 16);
  ctx.strokeStyle = '#ff9a3c'; ctx.lineWidth = 4; ctx.setLineDash([5, 4]);
  for (const x of [34, 37]) { ctx.beginPath(); ctx.moveTo(X(x), Y(0)); ctx.lineTo(X(x), Y(10)); ctx.stroke(); }
  ctx.setLineDash([]);
  for (const dm of p.demos) {
    const g = sampleDemo(dm, f);
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(X(g.x), Y(g.h) - 5, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = ACT[g.act].col; ctx.lineWidth = 2; ctx.stroke();
  }
}

function drawLegend(rx, ry) {
  ctx.font = `13px ${GOT}`; ctx.textBaseline = 'middle';
  const rows = [
    ['wall-run', '壁走りできる壁'], ['wall-kick', '壁キックで登る壁'], ['wall', 'ふつうの壁'],
    ['plat', '足場(数字は高さ)'], ['e-sword', '近接の敵'], ['e-gun', '銃の敵'], ['S', 'スタート'],
  ];
  rows.forEach((r, i) => {
    const y = ry + i * 22, x = rx;
    ctx.lineWidth = 4;
    if (r[0] === 'wall-run') { ctx.strokeStyle = RED; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 28, y); ctx.stroke(); }
    if (r[0] === 'wall-kick') { ctx.strokeStyle = '#ff9a3c'; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 28, y); ctx.stroke(); ctx.setLineDash([]); }
    if (r[0] === 'wall') { ctx.strokeStyle = '#7a5a62'; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 28, y); ctx.stroke(); }
    if (r[0] === 'plat') { ctx.fillStyle = 'rgba(180,150,160,0.35)'; ctx.fillRect(x, y - 7, 28, 14); }
    const ek = { 'e-sword':'sword', 'e-gun':'gun' }[r[0]];
    if (ek) { ctx.fillStyle = ENEMY[ek].col; ctx.beginPath(); ctx.arc(x + 14, y, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#100'; ctx.font = `bold 10px ${MIN}`; ctx.textAlign = 'center'; ctx.fillText(ENEMY[ek].ch, x + 14, y + 1); ctx.textAlign = 'left'; ctx.font = `13px ${GOT}`; }
    if (r[0] === 'S') { ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + 14, y, 8, 0, Math.PI * 2); ctx.stroke(); }
    ctx.fillStyle = '#d8c0c4'; ctx.fillText(r[1], x + 38, y);
  });
  const y0 = ry + rows.length * 22 + 10;
  ['run', 'jump', 'wrun', 'wkick', 'drop', 'fight'].forEach((k, i) => {
    const a = ACT[k], x = rx + (i % 3) * 112, y = y0 + Math.floor(i / 3) * 20;
    ctx.fillStyle = a.col; ctx.beginPath(); ctx.arc(x + 6, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#d8c0c4'; ctx.fillText(a.name, x + 16, y);
  });
  ctx.textBaseline = 'top';
}

function drawLayout(f) {
  ctx.fillStyle = '#0b060c'; ctx.fillRect(0, 0, W, H);
  drawRoomMap(0, 0, 720, 720, f);
  ctx.fillStyle = '#fff'; ctx.font = `bold 26px ${MIN}`; ctx.textBaseline = 'top';
  ctx.fillText('四角い部屋', 740, 24);
  ctx.fillStyle = '#9a6a72'; ctx.font = `13px ${GOT}`;
  ctx.fillText(`真上から(${ROOM.w}m × ${ROOM.h}m)。白い点は動きのお手本`, 740, 60);
  drawLegend(744, 100);
  ctx.fillStyle = '#d8c0c4'; ctx.font = `13px ${GOT}`;
  wrapText('西の壁で壁走り。北東の角の縦穴を壁キックで登ると上の足場に出て、そこから広場に落下攻撃もできる。', 740, 330, 510, 20);
  drawSideView(730, 420, 530, 280, f);
}

// ---------------------------------------------------------------- 設定メニュー
const ITEMS = [
  { key:'type',   name:'敵の種類',     vals:['刀', '銃', 'バズーカ', '混ぜる', 'ボス'] },
  { key:'count',  name:'敵の数',       vals:['1体', '3体', '5体'], def:1 },
  { key:'ai',     name:'敵の動き',     vals:['立つだけ', 'ガード', '攻撃する', 'ふつう'] },
  { key:'respawn',name:'倒したら',     vals:['出し直す', 'そのまま'] },
  { key:'ehp',    name:'敵のHP',       vals:['ふつう', '無限'] },
  { key:'php',    name:'自分のHP',     vals:['無限', 'ふつう'] },
  { key:'gauge',  name:'ゲージ', vals:['無限', 'ふつう'] },
  { key:'act_re', name:'敵を出し直す', action:true },
  { key:'act_pos',name:'スタートに戻る', action:true },
  { key:'act_quit',name:'トレーニング終了', action:true },
];
// val = メニューで選んでいる値、cur = ゲームに反映している値(メニューを閉じたときに val を写す)
const val = {}, cur = {};
for (const it of ITEMS) if (!it.action) val[it.key] = cur[it.key] = it.def || 0;
const V = k => ITEMS.find(i => i.key === k).vals[val[k]];
const CV = k => ITEMS.find(i => i.key === k).vals[cur[k]];
const isDirty = () => ITEMS.some(it => !it.action && val[it.key] !== cur[it.key]);
// 攻撃してくる: その場で、間隔をあけてランダムな技を出す(寄ってこない。予備動作の長さは技ごとに違う)
const ENEMY_TECHS = [{ name:'横斬り', wind:26 }, { name:'突き', wind:20 }, { name:'振り下ろし', wind:34 }, { name:'連撃', wind:30 }];
let sel = 0, menuOpen = true, selT = 0, prevSel = 0, toast = '', toastT = 0;

// ゲームの中(とても簡単なシミュレーション)
const sim = {};
const PATTERN = [
  { in:['X'], w:14, dmg:38, name:'弱1' }, { in:['X'], w:14, dmg:42, name:'弱2' }, { in:['X'], w:18, dmg:55, name:'弱3' },
  { in:['Y'], w:40, dmg:140, name:'溜め', hold:24 }, { in:['LB', 'X'], w:44, dmg:190, name:'スキル', skill:30 },
  { in:['B'], w:26, dmg:0, name:'回避' }, { in:['X'], w:14, dmg:38 }, { in:['Y'], w:20, dmg:80 }, { in:['A'], w:22, dmg:0, name:'ジャンプ' },
  { in:['X'], w:14, dmg:45 }, { in:['RB', 'Y'], w:56, dmg:420, name:'必殺技', sup:100 },
];
// 出す場所: 広場の円(真ん中 z=10)のまわり。1体=真ん中 / 3体=プレイヤー側に開いた弧 / 5体=円の上 / ボス=真ん中に1体
const SLOTS = {
  1: [[0, 10]],
  3: [[-3, 9], [0, 10.6], [3, 9]],
  5: [[-3.2, 9.4], [-1.6, 11.4], [1.6, 11.4], [3.2, 9.4], [0, 8.4]],
};
function resetSim(full) {
  const t = cur.type;
  sim.boss = t === 4;
  const slots = sim.boss ? [[0, 12]] : SLOTS[[1, 3, 5][cur.count]];
  const types = ['sword', 'gun', 'bazooka'];
  sim.enemies = slots.map(([x, z], i) => ({
    x, z, max: sim.boss ? 3000 : 400, hp: sim.boss ? 3000 : 400,
    type: t < 3 ? types[t] : t === 3 ? types[i % 3] : 'boss',
    dead:false, respawnT:0, flash:0, guardHits:0, broken:0, atkT: 60 + i * 23, wind:0, windMax:0, tech:'', lunge:0,
  }));
  if (full) {
    sim.px = 0; sim.pat = 0; sim.wait = 30; sim.atkF = 99; sim.hist = []; sim.pops = [];
    sim.php = 1; sim.skill = 1; sim.sup = 1; sim.combo = 0; sim.comboDmg = 0; sim.lastCombo = 0; sim.maxCombo = 0;
    sim.comboT = 0; sim.lastHit = 0; sim.tick = 0; sim.dodge = 0; sim.hurt = 0; sim.lastIn = 0;
  }
}
resetSim(true);

function addInput(arr) {
  const gap = sim.tick - sim.lastIn; sim.lastIn = sim.tick;
  if (sim.hist.length) sim.hist[0].f = Math.min(99, gap);
  sim.hist.unshift({ b:arr, f:0 }); if (sim.hist.length > 14) sim.hist.pop();
}
function pop(e, text, col, big) {
  sim.pops.push({ x:e.x + (Math.random() - 0.5) * 0.8, z:e.z, y:2.2, text, col, t:0, big });
}

function simStep() {
  sim.tick++;
  const ai = cur.ai, alive = sim.enemies.filter(e => !e.dead);
  // 狙う敵
  let tgt = null, best = 1e9;
  for (const e of alive) { const d = Math.abs(e.x - sim.px); if (d < best) { best = d; tgt = e; } }
  if (sim.dodge > 0) sim.dodge--;
  if (sim.hurt > 0) sim.hurt--;
  sim.atkF++;
  if (tgt) {
    const dx = tgt.x - sim.px;
    if (Math.abs(dx) > 1.0) { sim.px += Math.sign(dx) * Math.min(Math.abs(dx), 0.09); }
    else if (--sim.wait <= 0) {
      const a = PATTERN[sim.pat % PATTERN.length]; sim.pat++;
      sim.wait = a.w; sim.atkF = 0; sim.curAtk = a;
      addInput(a.in);
      if (a.name === '回避') sim.dodge = 20;
      if (a.skill) sim.skill = cur.gauge === 0 ? 1 : Math.max(0, sim.skill - 0.3);
      if (a.sup) sim.sup = cur.gauge === 0 ? 1 : 0;
      if (a.dmg > 0) {
        const hits = a.sup ? alive : [tgt];
        for (const e of hits) {
          const guarding = ai === 1 && e.broken === 0 && !a.sup;
          e.flash = 8;
          if (guarding) {
            e.guardHits++;
            if (e.guardHits >= 6) { e.broken = 120; e.guardHits = 0; }
            continue;
          }
          e.wind = 0;//攻撃の途中で当てると止まる
          const d = Math.round(a.dmg * (0.9 + Math.random() * 0.2) * (e.broken ? 1.5 : 1));
          if (cur.ehp === 0) e.hp -= d;
          if (cur.gauge === 1) { sim.skill = Math.min(1, sim.skill + 0.04); sim.sup = Math.min(1, sim.sup + 0.02); }
          if (e.hp <= 0) { e.dead = true; e.respawnT = 60; e.hp = 0; }
        }
      }
    }
  }
  // 敵
  for (const e of sim.enemies) {
    if (e.flash > 0) e.flash--;
    if (e.broken > 0) e.broken--;
    if (e.dead) {
      if (cur.respawn === 0 && --e.respawnT <= 0) { e.dead = false; e.hp = e.max; e.guardHits = 0; e.atkT = 60; }
      continue;
    }
    // 攻撃してくる(その場・間隔90F・技はランダム) / ふつう(ゲームの AI。モックでは間隔を長めにしただけ)
    if (ai === 2 || ai === 3) {
      if (e.wind > 0) {
        if (--e.wind === 0) {
          e.lunge = 16;
          if (Math.abs(e.x - sim.px) < 2.5 && sim.dodge === 0) {
            sim.hurt = 14;
            if (cur.php === 1) sim.php = Math.max(0, sim.php - 0.12);
            if (sim.php <= 0) { sim.php = 1; toast = 'HPが0 → 戻しました'; toastT = 90; }
          }
          e.atkT = ai === 2 ? 90 : 200;
        }
      } else if (e.lunge === 0 && --e.atkT <= 0) {
        const t = ENEMY_TECHS[Math.floor(Math.random() * ENEMY_TECHS.length)];
        e.tech = t.name; e.wind = e.windMax = t.wind;
      }
    }
    if (e.lunge > 0) e.lunge--;
  }
}

// 3D っぽい投影
let camX = 0;
function proj(x, y, z) { const dz = z + 3, f = 700; return [640 + (x - camX) * f / dz, 330 + (3.2 - y) * f / dz, f / dz]; }

function drawRoom() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#120a10'); g.addColorStop(0.45, '#1c0f15'); g.addColorStop(1, '#0a0508');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 奥の壁
  const ZB = 30, XW = 15;
  const [x0, y0] = proj(-XW, 11, ZB), [x1, y1] = proj(XW, 0, ZB);
  ctx.fillStyle = '#1e1016'; ctx.fillRect(x0, y0, x1 - x0, y1 - y0);
  ctx.strokeStyle = 'rgba(230,45,70,0.18)'; ctx.lineWidth = 1;
  for (let x = -XW; x <= XW; x += 3) { const [a, b] = proj(x, 11, ZB), [, d] = proj(x, 0, ZB); ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(a, d); ctx.stroke(); }
  // 掛け軸
  const [bx, by, bs] = proj(0, 8.5, ZB);
  ctx.fillStyle = '#e8dccb'; ctx.fillRect(bx - 1.2 * bs, by, 2.4 * bs, 5 * bs);
  ctx.fillStyle = '#1a0a0e'; ctx.font = `bold ${Math.round(1.6 * bs)}px ${MIN}`; ctx.textAlign = 'center';
  ctx.fillText('修', bx, by + 0.4 * bs); ctx.fillText('練', bx, by + 2.3 * bs); ctx.textAlign = 'left';
  ctx.fillStyle = RED; ctx.beginPath(); ctx.arc(bx + 0.7 * bs, by + 4.4 * bs, 0.25 * bs, 0, Math.PI * 2); ctx.fill();
  // 横の壁(壁走りの壁)
  for (const sx of [-1, 1]) {
    const pts = [proj(sx * XW, 0, -2), proj(sx * XW, 11, -2), proj(sx * XW, 11, ZB), proj(sx * XW, 0, ZB)];
    ctx.fillStyle = '#170c11'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.fill();
    if (sx > 0) {
      // 壁キックの縦穴(右の奥)
      for (const zz of [18, 21]) {
        const a = proj(sx * XW - 3, 0, zz), b = proj(sx * XW - 3, 10, zz), c = proj(sx * XW, 10, zz), d = proj(sx * XW, 0, zz);
        ctx.fillStyle = '#21121a'; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(d[0], d[1]); ctx.fill();
        ctx.strokeStyle = 'rgba(255,154,60,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); ctx.setLineDash([]);
      }
      const lk = proj(sx * XW - 1.5, 10.6, 19.5);
      ctx.fillStyle = 'rgba(255,154,60,0.85)'; ctx.font = `13px ${GOT}`; ctx.textAlign = 'center';
      ctx.fillText('壁キック', lk[0], lk[1]); ctx.textAlign = 'left';
      continue;
    }
    // 壁走りの帯
    for (const hh of [2.2, 3.4]) {
      const a = proj(sx * XW, hh, -1), b = proj(sx * XW, hh, ZB);
      ctx.strokeStyle = 'rgba(230,45,70,0.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke();
    }
    const lab = proj(sx * XW, 3.9, 14);
    ctx.fillStyle = 'rgba(230,45,70,0.7)'; ctx.font = `13px ${GOT}`; ctx.textAlign = 'center';
    ctx.fillText('壁走り', lab[0], lab[1]); ctx.textAlign = 'left';
  }
  // 床
  ctx.strokeStyle = 'rgba(230,45,70,0.12)'; ctx.lineWidth = 1;
  for (let x = -XW; x <= XW; x += 2) { const a = proj(x, 0, -2), b = proj(x, 0, ZB); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  for (let z = -2; z <= ZB; z += 2) { const a = proj(-XW, 0, z), b = proj(XW, 0, z); ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
  // 敵を出す円
  const c = proj(0, 0, 9.5);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(c[0], c[1], 8 * c[2], 1.6 * c[2], 0, 0, Math.PI * 2); ctx.stroke();
}

function drawFigure(x, z, opt) {
  const [sx, sy, s] = proj(x, 0, z);
  const h = (opt.h || 1.8) * s, w = (opt.w || 0.55) * s;
  ctx.save();
  ctx.globalAlpha = opt.alpha ?? 1;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.beginPath(); ctx.ellipse(sx, sy, w * 1.1, w * 0.3, 0, 0, Math.PI * 2); ctx.fill();
  const lift = (opt.lift || 0) * s;
  ctx.translate(sx + (opt.lean || 0) * s, sy - lift);
  ctx.fillStyle = opt.col;
  ctx.beginPath();
  ctx.moveTo(-w * 0.5, 0); ctx.lineTo(-w * 0.6, -h * 0.45); ctx.lineTo(-w * 0.75, -h * 0.75); ctx.lineTo(w * 0.75, -h * 0.75);
  ctx.lineTo(w * 0.6, -h * 0.45); ctx.lineTo(w * 0.5, 0); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(0, -h * 0.86, h * 0.1, 0, Math.PI * 2); ctx.fill();
  if (opt.scarf) { ctx.strokeStyle = RED; ctx.lineWidth = Math.max(2, s * 0.08); ctx.beginPath(); ctx.moveTo(-w * 0.2, -h * 0.76); ctx.quadraticCurveTo(-w * 1.2, -h * 0.8, -w * 1.6, -h * 0.6); ctx.stroke(); }
  if (opt.eye) { ctx.fillStyle = opt.eye; ctx.fillRect(-h * 0.06, -h * 0.88, h * 0.12, h * 0.025); }
  // 武器
  ctx.strokeStyle = opt.wcol || '#ddd'; ctx.lineWidth = Math.max(2, s * 0.05); ctx.lineCap = 'round';
  if (opt.weapon === 'sword') {
    const a = opt.swing ?? -0.6;
    ctx.beginPath(); ctx.moveTo(w * 0.6, -h * 0.5); ctx.lineTo(w * 0.6 + Math.cos(a) * h * 0.55, -h * 0.5 + Math.sin(a) * h * 0.55); ctx.stroke();
  } else if (opt.weapon === 'gun') {
    ctx.fillStyle = '#9ab'; ctx.fillRect(-w * 0.9, -h * 0.6, w * 0.9, h * 0.06);
  } else if (opt.weapon === 'bazooka') {
    ctx.fillStyle = '#a98'; ctx.fillRect(-w * 1.1, -h * 0.82, w * 1.9, h * 0.11);
  }
  if (opt.guard) {
    ctx.strokeStyle = 'rgba(150,200,255,0.85)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(0, -h * 0.5, h * 0.42, Math.PI * 0.6, Math.PI * 1.4); ctx.stroke();
  }
  ctx.restore();
  return [sx, sy, s, h];
}

function btnIcon(b, x, y, r) {
  const C = { X:'#3a7bd5', Y:'#e0b020', A:'#3caa50', B:'#d03a3a' };
  if (b === 'LB' || b === 'RB') {
    ctx.fillStyle = '#555'; ctx.beginPath(); ctx.roundRect(x - r * 1.2, y - r * 0.7, r * 2.4, r * 1.4, r * 0.5); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(r * 0.9)}px ${GOT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b, x, y + 1);
    return r * 2.4;
  }
  ctx.fillStyle = C[b]; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = `bold ${Math.round(r * 1.1)}px ${GOT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b, x, y + 1);
  return r * 2;
}

function drawGame() {
  camX = lerp(camX, sim.px * 0.5, 0.05);
  drawRoom();
  const ents = [];
  for (const e of sim.enemies) ents.push({ z:e.z, e });
  ents.push({ z:5, p:true });
  ents.sort((a, b) => b.z - a.z);
  for (const o of ents) {
    if (o.p) {
      const atk = sim.curAtk, f = sim.atkF;
      const swinging = atk && f < 10 && atk.dmg > 0;
      const r = drawFigure(sim.px + (sim.dodge > 0 ? Math.sin(sim.dodge / 20 * Math.PI) * -1.2 : 0), 5, {
        col: sim.hurt > 0 && sim.hurt % 4 < 2 ? '#fff' : '#26141a', h:1.85, scarf:true, eye:'#ff3050', weapon:'sword', wcol:'#e8e8f0',
        swing: swinging ? lerp(-2.4, 0.9, f / 10) : -1.9, lift: atk && atk.name === 'ジャンプ' && f < 22 ? Math.sin(f / 22 * Math.PI) * 1.4 : 0,
        alpha: sim.dodge > 0 ? 0.55 : 1,
      });
      if (swinging) {
        const [sx, sy, s] = r;
        ctx.strokeStyle = `rgba(255,255,255,${0.8 - f / 12})`; ctx.lineWidth = s * 0.12;
        ctx.beginPath(); ctx.arc(sx, sy - s * 0.9, s * 1.3, -2.2 + f * 0.1, -0.2 + f * 0.1); ctx.stroke();
        if (atk.dmg >= 140) { ctx.strokeStyle = `rgba(230,45,70,${0.7 - f / 14})`; ctx.lineWidth = s * 0.2; ctx.beginPath(); ctx.arc(sx, sy - s * 0.9, s * 1.6, -2.4 + f * 0.12, 0 + f * 0.12); ctx.stroke(); }
      }
      continue;
    }
    const e = o.e;
    if (e.dead) {
      if (cur.respawn === 0) {
        const [sx, sy, s] = proj(e.x, 0, e.z), k = 1 - e.respawnT / 60;
        ctx.strokeStyle = `rgba(230,45,70,${0.3 + k * 0.5})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(sx, sy, s * (0.3 + k * 0.6), s * 0.18 * (0.3 + k * 0.6) * 1.5, 0, 0, Math.PI * 2); ctx.stroke();
      }
      continue;
    }
    const guardNow = cur.ai === 1 && e.broken === 0;
    const boss = e.type === 'boss';
    const lean = e.lunge > 0 ? Math.sin(e.lunge / 16 * Math.PI) * -(Math.sign(e.x - sim.px) || 1) * 1.2 : 0;
    const r = drawFigure(e.x, e.z, {
      col: e.flash > 0 && e.flash % 4 < 2 ? '#fff' : boss ? '#2a2230' : '#2b1d22', h: boss ? 4.2 : 1.8, w: boss ? 1.6 : 0.55,
      eye: e.wind > 0 ? '#ff2020' : boss ? '#ffb020' : '#c09090', weapon: boss ? 'bazooka' : e.type, wcol:'#bbb', swing: e.wind > 0 ? -2.6 : -0.4,
      guard: guardNow, lean,
    });
    const [sx, sy, s, h] = r;
    if (e.wind > 0) {
      // 予備動作(モックでの目印。ゲームでは敵のアニメで見せる)
      ctx.fillStyle = `rgba(255,60,60,0.9)`; ctx.font = `bold ${Math.round(s * 0.26)}px ${GOT}`; ctx.textAlign = 'center';
      ctx.fillText(e.tech, sx, sy - h - s * 0.55); ctx.textAlign = 'left';
    }
    if (e.broken > 0) { ctx.fillStyle = '#ffd84a'; ctx.font = `bold ${Math.round(s * 0.28)}px ${GOT}`; ctx.textAlign = 'center'; ctx.fillText('崩れ', sx, sy - h - s * 0.45); ctx.textAlign = 'left'; }
    // 敵のHP
    const bw = boss ? s * 3 : s * 1.1;
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(sx - bw / 2, sy - h - s * 0.3, bw, 5);
    ctx.fillStyle = RED; ctx.fillRect(sx - bw / 2, sy - h - s * 0.3, bw * e.hp / e.max, 5);
  }
  // ふつうの HUD(HP の輪と弧・スキル)
  const hx = 70, hy = 70;
  ctx.strokeStyle = '#3a2a30'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = '#d8d0d8'; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(hx, hy, 30, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * sim.sup); ctx.stroke();
  ctx.fillStyle = '#2a1418'; ctx.fillRect(hx + 36, hy - 6, 300, 10);
  ctx.fillStyle = '#9a1c2e'; ctx.fillRect(hx + 36, hy - 6, 300 * sim.php, 10);
  ctx.fillStyle = '#2a1418'; ctx.fillRect(hx + 36, hy + 8, 220, 4);
  ctx.fillStyle = '#c8c8d4'; ctx.fillRect(hx + 36, hy + 8, 220 * sim.skill, 4);
  ctx.fillStyle = '#e8dccb'; ctx.font = `bold 26px ${MIN}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('忍', hx, hy + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'top';
  // 全員倒した
  if (sim.enemies.every(e => e.dead) && cur.respawn === 1) {
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(0, 600, W, 50);
    ctx.fillStyle = '#fff'; ctx.font = `18px ${GOT}`; ctx.textAlign = 'center';
    ctx.fillText('全員倒した ― メニューの「敵を出し直す」で戻る', W / 2, 614); ctx.textAlign = 'left';
  }
  if (!menuOpen) {
    ctx.fillStyle = 'rgba(242,221,224,0.6)'; ctx.font = `13px ${GOT}`; ctx.textAlign = 'right';
    ctx.fillText('メニュー: スタートボタン(このモックは Esc・Tab・画面クリック)', W - 20, H - 28); ctx.textAlign = 'left';
  }
}

  ctx.fillStyle = '#d8c0c4'; ctx.font = `13px ${GOT}`;
  wrapText(help, MX, 560, 520, 18);
  if (isDirty()) { ctx.fillStyle = RED; ctx.font = `bold 13px ${GOT}`; ctx.fillText('● 変えた設定はメニューを閉じたときに反映(敵を出し直す)', MX, 620); }
  ctx.fillStyle = '#7a5a62'; ctx.font = `12px ${GOT}`;
  ctx.fillText('↑↓ 選ぶ   ←→ 変える   A 決める   B 閉じる', MX + 110, 104);
  if (toastT > 0) {
    toastT--; ctx.fillStyle = `rgba(230,45,70,${Math.min(1, toastT / 20)})`; ctx.fillRect(W / 2 + 40, 640, 480, 40);
    ctx.fillStyle = '#fff'; ctx.font = `16px ${GOT}`; ctx.textAlign = 'center'; ctx.fillText(toast, W / 2 + 280, 651); ctx.textAlign = 'left';
  }
}
function wrapText(s, x, y, w, lh) {
  let line = '';
  for (const ch of s) { if (ctx.measureText(line + ch).width > w) { ctx.fillText(line, x, y); y += lh; line = ''; } line += ch; }
  ctx.fillText(line, x, y);
}

function changeVal(d) {
  const it = ITEMS[sel];
  if (it.action) { if (d === 0) doAction(it.key); return; }
  val[it.key] = (val[it.key] + d + it.vals.length) % it.vals.length;
}
// メニューの値をゲームに反映して敵を出し直す(閉じたとき・「敵を出し直す」)
function applySettings() {
  Object.assign(cur, val);
  resetSim(false);
  if (cur.php === 0) sim.php = 1;
  if (cur.gauge === 0) { sim.skill = 1; sim.sup = 1; }
}
function closeMenu() {
  if (isDirty()) { applySettings(); toast = '設定を反映して敵を出し直しました'; toastT = 90; }
  menuOpen = false;
}
function doAction(k) {
  if (k === 'act_re') { applySettings(); toast = '敵を出し直しました'; }
  if (k === 'act_pos') { sim.px = 0; camX = 0; toast = 'スタートに戻りました'; }
  if (k === 'act_quit') { toast = '(ゲームではステージセレクトに戻る)'; }
  toastT = 90;
}
function moveSel(d) { prevSel = sel; sel = (sel + d + ITEMS.length) % ITEMS.length; selT = 0; }

// ---------------------------------------------------------------- 共通
let mode = 'B', frame = 0, stopped = false, slow = false, sub = 0;
function setMode(m) {
  mode = m;
  if (m === 'menu') menuOpen = true;
  if (m === 'game' && menuOpen) closeMenu();
  document.querySelectorAll('button[data-m]').forEach(b => b.classList.toggle('on', b.dataset.m === m || (m === 'game' && b.dataset.m === 'menu' && false)));
  const d = document.getElementById('desc');
  if (m === 'room') d.innerHTML = '<b>四角い部屋</b>(40m × 40m)— 西の壁が<b>壁走りゾーン</b>(長さ30m)、北東の角が<b>壁キックで登る縦穴</b>(幅3m・高さ10m)。登った先は北の壁沿いの足場(10m)で、そこから真ん中の広場に落下攻撃もできる。広場には設定メニューで選んだ敵を出す。';
  else d.innerHTML = '<b>設定メニュー</b>(ポーズの C 案と同じく左に寄せて、ゲームを右に見せる)。メニューを開いている間はゲームを止める。表示の項目(ダメージ・入力・当たり判定・速さ)は入れない。<br>' +
    '<b>決めたこと(11/27)</b>: 最初は「刀・3体・立っているだけ・すぐ出し直す」。変えた設定は<b>メニューを閉じたときに反映</b>して敵を出し直す。' +
    '敵は配置データをコードで作って EnemyManager::CreateEnemy で出す(フェーズは使わない)。全部の敵のモデルはトレーニングに入るときに読む。' +
    '「攻撃してくる」はその場から動かず、間をあけてランダムな技(Enemy Debug の Stop AI ＋ Loop と同じ形)。';
}
document.querySelectorAll('button[data-m]').forEach(b => b.onclick = () => { setMode(b.dataset.m); location.hash = b.dataset.m; });
document.getElementById('pause').onclick = e => { stopped = !stopped; e.target.textContent = stopped ? '動かす' : '止める'; };
document.getElementById('slow').onclick = e => { slow = !slow; e.target.textContent = '1/4の速さ: ' + (slow ? 'オン' : 'オフ'); e.target.classList.toggle('on', slow); };

addEventListener('keydown', e => {
  if (mode !== 'menu' && mode !== 'game') return;
  if (e.key === 'Escape' || e.key === 'Tab') { e.preventDefault(); setMode(menuOpen ? 'game' : 'menu'); return; }
  if (!menuOpen) return;
  if (e.key === 'ArrowUp') { moveSel(-1); e.preventDefault(); }
  if (e.key === 'ArrowDown') { moveSel(1); e.preventDefault(); }
  if (e.key === 'ArrowLeft') { changeVal(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight') { changeVal(1); e.preventDefault(); }
  if (e.key === 'Enter' || e.key === ' ') { changeVal(ITEMS[sel].action ? 0 : 1); e.preventDefault(); }
});
cv.addEventListener('click', e => {
  if (mode !== 'menu' && mode !== 'game') return;
  const r = cv.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (!menuOpen) { setMode('menu'); return; }
  if (x > 620) { setMode('game'); return; }
  ITEMS.forEach((it, i) => {
    const ry = MY + i * ROW + (it.action ? 14 : 0);
    if (y >= ry - 3 && y < ry + ROW - 5) {
      if (i !== sel) moveSel(i - sel);
      else if (it.action) doAction(it.key);
      else changeVal(x < MX + 330 ? -1 : 1);
    }
  });
});

function parseHash() {
  const h = decodeURIComponent(location.hash.slice(1));
  if (!h) return;
  const [m, f] = h.split(',');
  if (m === 'room' || m === 'menu' || m === 'game') setMode(m);
  if (f !== undefined && f !== '') { frame = +f; stopped = true; document.getElementById('pause').textContent = '動かす'; }
}
addEventListener('hashchange', parseHash);
setMode('room'); parseHash();
// #menu,N や #game,N はシミュレーションを N フレーム進めて止める
if ((mode === 'menu' || mode === 'game') && stopped) { for (let i = 0; i < frame; i++) simStep(); }

function loop() {
  if (!stopped) {
    sub++;
    if (!slow || sub % 4 === 0) {
      frame++;
      // メニューを開いている間はゲームを止める
      if (mode === 'game' || (mode === 'menu' && !menuOpen)) simStep();
    }
  }
  if (mode === 'room') drawLayout(frame);
  else { drawGame(); if (menuOpen) drawMenu(); }
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
