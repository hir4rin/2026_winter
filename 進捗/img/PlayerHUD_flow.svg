<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" font-family="Meiryo, 'Yu Gothic', sans-serif" font-size="14">
  <rect width="760" height="330" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker>
  </defs>

  <!-- SceneMain -->
  <rect x="20" y="20" width="200" height="290" rx="10" fill="#f4f6fb" stroke="#8a95b5"/>
  <text x="120" y="45" text-anchor="middle" font-weight="bold">SceneMain</text>
  <rect x="40" y="70" width="160" height="60" rx="6" fill="#fff" stroke="#8a95b5"/>
  <text x="120" y="95" text-anchor="middle">m_player</text>
  <text x="120" y="115" text-anchor="middle" font-size="12" fill="#666">shared_ptr&lt;Player&gt;</text>
  <rect x="40" y="200" width="160" height="60" rx="6" fill="#fff" stroke="#8a95b5"/>
  <text x="120" y="225" text-anchor="middle">m_uiManager</text>
  <text x="120" y="245" text-anchor="middle" font-size="12" fill="#666">unique_ptr&lt;UIManager&gt;</text>
  <line x1="120" y1="130" x2="120" y2="198" stroke="#555" marker-end="url(#a)"/>
  <text x="128" y="160" font-size="12">InGameInit(</text>
  <text x="128" y="176" font-size="12">  camera, m_player)</text>

  <!-- UIManager -->
  <rect x="270" y="150" width="190" height="160" rx="10" fill="#f4f6fb" stroke="#8a95b5"/>
  <text x="365" y="175" text-anchor="middle" font-weight="bold">UIManager</text>
  <rect x="290" y="190" width="150" height="40" rx="6" fill="#fff" stroke="#8a95b5"/>
  <text x="365" y="215" text-anchor="middle">KessatsuUI</text>
  <rect x="290" y="245" width="150" height="45" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="2"/>
  <text x="365" y="266" text-anchor="middle" font-weight="bold">PlayerHUD</text>
  <text x="365" y="283" text-anchor="middle" font-size="11" fill="#c0392b">今回追加</text>
  <line x1="200" y1="230" x2="268" y2="230" stroke="#555" marker-end="url(#a)"/>

  <!-- Player -->
  <rect x="520" y="20" width="220" height="200" rx="10" fill="#f4f6fb" stroke="#8a95b5"/>
  <text x="630" y="45" text-anchor="middle" font-weight="bold">Player</text>
  <text x="540" y="75" font-size="13">GetHp()</text>
  <text x="540" y="97" font-size="13">GetSkillGauge()</text>
  <text x="540" y="119" font-size="13">GetUltGauge()</text>
  <text x="540" y="148" font-size="13" fill="#c0392b">GetMaxHp()        ← 追加</text>
  <text x="540" y="170" font-size="13" fill="#c0392b">GetMaxGauge()   ← 追加</text>
  <text x="540" y="200" font-size="11" fill="#666">（値は読むだけ。書き換えない）</text>

  <!-- weak_ptr -->
  <path d="M440,262 C500,262 500,140 518,130" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#b)"/>
  <text x="478" y="300" font-size="12" fill="#c0392b">weak_ptr&lt;Player&gt;</text>
  <text x="478" y="316" font-size="11" fill="#c0392b">毎フレーム lock して値を読む</text>
</svg>
