<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 360" font-family="Meiryo, 'Yu Gothic', sans-serif" font-size="13">
  <rect width="820" height="360" fill="#ffffff"/>
  <text x="20" y="28" font-size="15" font-weight="bold">必殺技ゲージは5枚を重ねて作る（左から描く順）</text>
  <defs>
    <pattern id="rope" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="10" height="10" fill="none"/><rect width="4" height="10" fill="#1f3fa8"/>
    </pattern>
    <pattern id="ropeDim" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="4" height="10" fill="#0d1a45"/>
    </pattern>
    <pattern id="holes" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="10" height="10" fill="#111"/><rect width="4" height="10" fill="#fff"/>
    </pattern>
  </defs>

  <!-- 1 base -->
  <g transform="translate(90,140)">
    <circle r="62" fill="#fff" opacity="0.0"/>
    <circle r="66" fill="#ddd" opacity="0.6"/>
    <circle r="50" fill="#000"/>
    <circle r="40" fill="#2233dd"/>
    <text y="10" text-anchor="middle" font-size="34" fill="#000" stroke="#fff" stroke-width="1">殺</text>
  </g>
  <text x="90" y="235" text-anchor="middle" font-weight="bold">① UltGaugeBase</text>
  <text x="90" y="253" text-anchor="middle" font-size="11">真ん中の紋章</text>
  <text x="90" y="269" text-anchor="middle" font-size="11" fill="#c0392b">外側に白いぼかし</text>
  <text x="90" y="285" text-anchor="middle" font-size="11" fill="#c0392b">→ 一番先に描く</text>

  <!-- 2 dim -->
  <g transform="translate(250,140)">
    <circle r="56" fill="none" stroke="url(#ropeDim)" stroke-width="14"/>
  </g>
  <text x="250" y="235" text-anchor="middle" font-weight="bold">② UltGaugeColor</text>
  <text x="250" y="253" text-anchor="middle" font-size="11">全部を暗く(明るさ25)</text>
  <text x="250" y="269" text-anchor="middle" font-size="11">= まだたまっていない所</text>

  <!-- 3 gauge -->
  <g transform="translate(410,140)">
    <path d="M0,-56 A56,56 0 1 1 -53.3,17.3" fill="none" stroke="url(#rope)" stroke-width="14"/>
    <path d="M0,-80 A80,80 0 1 1 -76,24.7" fill="none" stroke="#c0392b" stroke-width="2" marker-end="url(#ar)"/>
  </g>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker></defs>
  <text x="410" y="235" text-anchor="middle" font-weight="bold">③ UltGaugeColor</text>
  <text x="410" y="253" text-anchor="middle" font-size="11">DrawCircleGaugeF で</text>
  <text x="410" y="269" text-anchor="middle" font-size="11">上から時計回りに割合ぶん</text>

  <!-- 4 frame -->
  <g transform="translate(570,140)">
    <circle r="56" fill="none" stroke="url(#holes)" stroke-width="18"/>
  </g>
  <text x="570" y="235" text-anchor="middle" font-weight="bold">④ UltGauge</text>
  <text x="570" y="253" text-anchor="middle" font-size="11">黒い輪。縄の所は透明</text>
  <text x="570" y="269" text-anchor="middle" font-size="11">→ 下の②③の青が透けて見える</text>

  <!-- 5 max -->
  <g transform="translate(730,140)">
    <circle r="62" fill="none" stroke="#7b61ff" stroke-width="6" opacity="0.8"/>
    <circle r="62" fill="none" stroke="#b9a8ff" stroke-width="14" opacity="0.25"/>
  </g>
  <text x="730" y="235" text-anchor="middle" font-weight="bold">⑤ UltGauge_circle</text>
  <text x="730" y="253" text-anchor="middle" font-size="11">満タンのときだけ</text>
  <text x="730" y="269" text-anchor="middle" font-size="11">加算で点滅</text>

  <!-- plus signs -->
  <text x="170" y="148" font-size="22" fill="#888">+</text>
  <text x="330" y="148" font-size="22" fill="#888">+</text>
  <text x="490" y="148" font-size="22" fill="#888">+</text>
  <text x="650" y="148" font-size="22" fill="#888">+</text>

  <rect x="20" y="305" width="780" height="40" rx="6" fill="#f4f6fb" stroke="#8a95b5"/>
  <text x="34" y="330" font-size="12">大きさの目安（1280×720 基準）：輪の直径150・紋章の直径115・光の直径160。中心は (90, 90)。</text>
</svg>
