<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HPの飾り</title>
<style>
:root{--bg:#101116;--panel:#1a1c23;--text:#e6e6ea;--sub:#9a9caa;--line:#2c2f39}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Yu Gothic UI","Meiryo",sans-serif}
header{position:sticky;top:0;z-index:10;background:#0c0d11ee;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:16px;font-weight:600;margin:0 8px 0 0}
header label{font-size:13px;color:var(--sub);display:flex;align-items:center;gap:6px}
header button{background:#23262f;color:var(--text);border:1px solid #3a3e4a;border-radius:6px;padding:5px 10px;font-size:13px;cursor:pointer}
header button:hover{background:#2e323d}
header select{background:#23262f;color:var(--text);border:1px solid #3a3e4a;border-radius:6px;padding:4px}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(640px,1fr));gap:14px;padding:14px 16px 40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.cap{display:flex;gap:10px;align-items:baseline;padding:8px 12px;border-bottom:1px solid var(--line)}
.cap b{font-size:14px}
.cap span{font-size:12px;color:var(--sub)}
.cap .no{color:#e8c46a;font-weight:700;min-width:28px}
.stage{position:relative;width:640px;height:170px;margin:0 auto}
.stage.bg0{background:linear-gradient(160deg,#3b3f47,#24272d 60%,#2d2a28)}
.stage.bg1{background:linear-gradient(160deg,#a9adb3,#8d9095 50%,#b7a58f)}
.stage.bg2{background:radial-gradient(circle at 70% 20%,#3a2a66 0,#120f25 45%,#07080e 100%)}
.stage.bg3{background:linear-gradient(160deg,#e9e4da,#cfc7b7)}
.stage svg{position:absolute;left:0;top:0;z-index:2}
.ult{position:absolute;left:12px;top:9px;width:156px;height:162px;z-index:1}
.ult img{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.ult .base{width:163px}
.ult .col{width:155px;height:162px}
.ult .dim{filter:brightness(.1)}
.ult .ring{width:155px;height:162px}
</style>
</head>
<body>
<header>
  <h1>HP(輪から伸びる弧)＋スキル(下の細い帯)の飾り 12案(色は静脈血と白銀)</h1>
  <label>HP <input id="hp" type="range" min="0" max="100" value="70"></label>
  <label>スキル <input id="sk" type="range" min="0" max="100" value="60"></label>
  <button id="dmg">被弾 −18%</button>
  <button id="heal">回復 +30%</button>
  <button id="use">スキル使用 −20</button>
  <button id="gain">ヒット +7</button>
  <label>背景
    <select id="bgsel">
      <option value="bg0">暗いコンクリート</option>
      <option value="bg1">明るい壁</option>
      <option value="bg2">夜の街</option>
      <option value="bg3">白っぽい場所</option>
    </select>
  </label>
</header>
<main id="grid"></main>

const ULT_RATE = 0.65;

const S = { hp:0.7, tr:0.7, trWait:0, sk:3.0, skDisp:3.0, t:0, use:0, useIdx:-1, ready:[0,0,0,0,0] };
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const segRate=k=>clamp(S.skDisp-k);
const pulse=(sp=6)=>0.5+0.5*Math.sin(S.t*sp);
const low=()=>S.hp<0.3;
const pts=a=>a.map(p=>p.join(",")).join(" ");
const P=(a,attr)=>`<polygon points="${pts(a)}" ${attr}/>`;

const CX=90, CY=90, R=86, A0=-Math.PI*0.62, AE=-Math.PI*0.12, X1=590;
const EY=CY+R*Math.sin(AE), EX=CX+R*Math.cos(AE);
const pol=(r,a)=>[CX+r*Math.cos(a),CY+r*Math.sin(a)];
const arcD=(r,a0,a1)=>{const p0=pol(r,a0),p1=pol(r,a1);return `M${p0} A${r} ${r} 0 0 1 ${p1}`};
const FULL=`${arcD(R,A0,AE)} L${X1} ${EY}`;
const TOTAL=R*(AE-A0)+(X1-EX);

// 色の案
// rim: 縁(外側から) / base: 空の所 / trail: 減った残像 / hp: [暗,中,明] / sk: [暗,中,明] / glow: 光 / cap: 端の金具 / sheen: 光が走る
// 道の上の位置と向き
function at(L){const arcLen=R*(AE-A0);if(L<arcLen){const a=A0+L/R;const q=pol(R,a);return {x:q[0],y:q[1],nx:Math.cos(a),ny:Math.sin(a),tx:-Math.sin(a),ty:Math.cos(a)};}
  return {x:EX+(L-arcLen),y:EY,nx:0,ny:-1,tx:1,ty:0};}
const rnd=k=>((Math.sin(k*127.1)*43758.5453)%1+1)%1;
const onBar=(id,len,op=1)=>`<path d="${FULL}" fill="none" stroke="url(#${id})" stroke-width="12" stroke-dasharray="${Math.max(0,len)} 5000" opacity="${op}"/>`;
const seg=(a,b,w,col,attr="")=>`<path d="${FULL}" fill="none" stroke="${col}" stroke-width="${w}" stroke-dasharray="0 ${Math.max(0,a)} ${Math.max(0,b-a)} 5000" ${attr}/>`;
function hexA(h){h=h.replace("#","");return [0,2,4].map(i=>parseInt(h.substr(i,2),16))}
const mixC=(a,b,t)=>{const pa=hexA(a),pb=hexA(b);return `rgb(${pa.map((v,i)=>Math.round(v+(pb[i]-v)*t)).join(",")})`;};

const FX=[
{name:"F1 金属のヘアライン", note:"中に細い横筋の模様。磨いた金属のような質感(動かない)", f(i){
  let p=`<defs><pattern id="hl${i}" width="60" height="12" patternUnits="userSpaceOnUse">`;
  for(let k=0;k<12;k++)p+=`<rect x="${rnd(k)*30}" y="${k}" width="${20+rnd(k+3)*40}" height=".6" fill="${k%3?"#000":"#fff"}" opacity="${0.15+rnd(k+9)*0.25}"/>`;
  p+=`</pattern></defs>`;
  return p+onBar(`hl${i}`,S.hp*TOTAL);}},

{name:"F2 斜めの刻み", note:"細い斜めの線を刻む。刀の柄巻きのような締まった模様", f(i){
  return `<defs><pattern id="dg${i}" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(40)"><rect width="1.4" height="6" fill="#000" opacity=".45"/></pattern></defs>`+onBar(`dg${i}`,S.hp*TOTAL);}},

{name:"F3 青海波の地紋", note:"波の和柄をうっすら入れる。近くで見ると分かる程度", f(i){
  let p=`<defs><pattern id="sg${i}" width="16" height="8" patternUnits="userSpaceOnUse">`;
  for(const [cx,cy] of [[0,8],[16,8],[8,4],[8,12],[0,0],[16,0]])for(const r of [7,5,3])p+=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#ffd0d4" stroke-width=".6" opacity=".35"/>`;
  p+=`</pattern></defs>`;
  return p+onBar(`sg${i}`,S.hp*TOTAL);}},

{name:"F4 亀甲の地紋", note:"六角形の亀甲模様をうっすら。鎧のような硬さ", f(i){
  const hx=(cx,cy,r)=>[...Array(6)].map((_,k)=>`${cx+r*Math.cos(Math.PI/3*k)},${cy+r*Math.sin(Math.PI/3*k)}`).join(" ");
  let p=`<defs><pattern id="kk${i}" width="12" height="${6.93*2}" patternUnits="userSpaceOnUse">`;
  for(const [cx,cy] of [[0,0],[12,0],[6,6.93],[0,13.86],[12,13.86]])p+=`<polygon points="${hx(cx,cy,4)}" fill="none" stroke="#000" stroke-width=".8" opacity=".5"/>`;
  p+=`</pattern></defs>`;
  return p+onBar(`kk${i}`,S.hp*TOTAL);}},

{name:"F5 銀の象嵌", note:"バーの真ん中に細い銀の線を埋め込み、4分の1ごとに菱形の鋲", f(){
  let s=seg(0,S.hp*TOTAL,1.4,"#c8ced8");
  for(const r of [0.25,0.5,0.75]){const q=at(TOTAL*r),on=S.hp>=r,c=on?"#e8ecf2":"#4a4e58";
    s+=`<polygon points="${q.x},${q.y-6} ${q.x+4},${q.y} ${q.x},${q.y+6} ${q.x-4},${q.y}" fill="${c}" stroke="#060406" stroke-width="1"/>`;}
  return s;}},

{name:"F6 境目を斜めに切る", note:"HPの終わりを、刀で斬ったような斜めの切り口にする", f(){
  if(S.hp<=0||S.hp>=1)return "";const q=at(S.hp*TOTAL);
  const a=[q.x+q.nx*8+q.tx*5,q.y+q.ny*8+q.ty*5],b=[q.x-q.nx*8-q.tx*5,q.y-q.ny*8-q.ty*5];
  return `<polygon points="${a} ${q.x+q.nx*8+q.tx*12},${q.y+q.ny*8+q.ty*12} ${q.x-q.nx*8+q.tx*12},${q.y-q.ny*8+q.ty*12} ${b}" fill="#160a0c"/>`+
         `<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="#ffffff" stroke-width="2"/>`+
         `<line x1="${a[0]+q.tx*2}" y1="${a[1]+q.ty*2}" x2="${b[0]+q.tx*2}" y2="${b[1]+q.ty*2}" stroke="#e04a5a" stroke-width="1"/>`;}},

{name:"F7 被弾で斬り裂かれる", note:"当たると減った所に斬撃の線が走り、上下に割れて落ちる", f(){
  const c=S.cut;if(!c||c.t>0.8)return "";const a=c.a*TOTAL,b=c.b*TOTAL,t=c.t;
  let s="";
  if(t<0.08){const k=t/0.08,p0=at(a),p1=at(lerp(a,b,k));s+=`<line x1="${p0.x}" y1="${p0.y+8}" x2="${p1.x}" y2="${p1.y-8}" stroke="#fff" stroke-width="2.5"/>`;}
  else{const u=(t-0.08)/0.72,d=u*u*30+u*4,op=1-u;
    s+=`<g transform="translate(${u*6} ${-d*0.5})" opacity="${op}">${seg(a,b,6,"#8a0a1e","transform=\"translate(0 -3)\"")}</g>`;
    s+=`<g transform="translate(${u*-4} ${d})" opacity="${op}">${seg(a,b,6,"#3a0008","transform=\"translate(0 3)\"")}</g>`;
    if(u<0.3){const p0=at(a),p1=at(b);s+=`<line x1="${p0.x}" y1="${p0.y+8}" x2="${p1.x}" y2="${p1.y-8}" stroke="#fff" stroke-width="${2.5*(1-u/0.3)}"/>`;}}
  return s;}},

{name:"F8 墨になって消える", note:"当たると減った所が墨のように黒く染まり、にじんで消える", f(i){
  const c=S.cut;if(!c||c.t>1)return "";const a=c.a*TOTAL,b=c.b*TOTAL,t=c.t,op=1-t;
  let s=`<defs><filter id="ink${i}" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="${1+5*t}"/></filter></defs>`;
  s+=seg(a,b,12+14*t,"#000",`filter="url(#ink${i})" opacity="${op}"`);
  for(let k=0;k<6;k++){const q=at(lerp(a,b,rnd(k+11))),r=(3+rnd(k)*5)*(0.5+t*1.5);s+=`<circle cx="${q.x}" cy="${q.y+(rnd(k+4)-0.5)*10*t}" r="${r}" fill="#000" opacity="${op*0.8}" filter="url(#ink${i})"/>`;}
  return s;}},

{name:"F9 減ると縁が赤く染まる", note:"HPが減るほど、銀の縁が血の色に染まっていく(動かない)", f(i){
  const t=Math.pow(1-S.hp,1.3);
  return `<defs><mask id="rm${i}" maskUnits="userSpaceOnUse" x="0" y="0" width="640" height="200"><path d="${FULL}" fill="none" stroke="#fff" stroke-width="18"/><path d="${FULL}" fill="none" stroke="#000" stroke-width="15"/></mask></defs>`+
         `<path d="${FULL}" fill="none" stroke="${mixC("#a8b0bc","#c0102a",t)}" stroke-width="18" mask="url(#rm${i})"/>`;}},

{name:"F10 房飾り", note:"右端の金具から、刀の下げ緒のような赤い房が下がる。少し揺れる", f(){
  const sw=Math.sin(S.t*1.8)*6+(S.hit||0)*Math.sin(S.t*30)*8;
  const x=X1+10,y=EY+6;
  let s=`<g transform="rotate(${sw} ${x} ${y})">`;
  s+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+16}" stroke="#6a0010" stroke-width="2.5"/>`;
  s+=`<circle cx="${x}" cy="${y+18}" r="4" fill="#c8ced8" stroke="#060406" stroke-width="1"/>`;
  for(let k=-3;k<=3;k++)s+=`<line x1="${x+k*0.8}" y1="${y+21}" x2="${x+k*2.2}" y2="${y+46}" stroke="${k%2?"#8a0a1e":"#5a0010"}" stroke-width="1.6"/>`;
  s+=`<rect x="${x-4}" y="${y+24}" width="8" height="3" fill="#c8ced8"/>`;
  return s+`</g>`;}},

{name:"F11 根元に銀の金具", note:"弧が輪から出る所に、鍔のような銀の金具を付ける(動かない)", f(){
  const q=at(2),r=[q.tx,q.ty],n=[q.nx,q.ny];
  const pt=(u,v)=>`${q.x+r[0]*u+n[0]*v},${q.y+r[1]*u+n[1]*v}`;
  return `<polygon points="${pt(-4,-13)} ${pt(10,-13)} ${pt(14,-8)} ${pt(14,8)} ${pt(10,13)} ${pt(-4,13)}" fill="#060406"/>`+
         `<polygon points="${pt(-2,-11)} ${pt(9,-11)} ${pt(12,-7)} ${pt(12,7)} ${pt(9,11)} ${pt(-2,11)}" fill="url(#silver0)"/>`+
         `<polygon points="${pt(-2,-11)} ${pt(9,-11)} ${pt(12,-7)} ${pt(12,7)} ${pt(9,11)} ${pt(-2,11)}" fill="#c8ced8"/>`+
         `<line x1="${q.x+r[0]*5+n[0]*-9}" y1="${q.y+r[1]*5+n[1]*-9}" x2="${q.x+r[0]*5+n[0]*9}" y2="${q.y+r[1]*5+n[1]*9}" stroke="#5a6070" stroke-width="1.5"/>`+
         `<circle cx="${q.x+r[0]*5}" cy="${q.y+r[1]*5}" r="2.2" fill="#5a0010"/>`;}},

{name:"F12 先が刀身", note:"HPの先を銀の刀身の切っ先にする。HPが減ると刃が短くなる", f(){
  if(S.hp<=0)return "";const L=S.hp*TOTAL,q=at(L),b=at(Math.max(0,L-34));
  const pt=(p,u,v)=>`${p.x+p.tx*u+p.nx*v},${p.y+p.ty*u+p.ny*v}`;
  return `<polygon points="${pt(b,0,6)} ${pt(q,-6,6)} ${pt(q,8,-6)} ${pt(b,0,-6)}" fill="#060406"/>`+
         `<polygon points="${pt(b,0,5)} ${pt(q,-6,5)} ${pt(q,6,-5)} ${pt(b,0,-5)}" fill="#d8dce4"/>`+
         `<polygon points="${pt(b,0,5)} ${pt(q,-6,5)} ${pt(q,0,0)} ${pt(b,0,0)}" fill="#9aa0ac"/>`+
         `<line x1="${b.x}" y1="${b.y}" x2="${q.x}" y2="${q.y}" stroke="#ffffff" stroke-width="1"/>`+
         `<rect x="${b.x-2}" y="${b.y-7}" width="3" height="14" fill="#c8ced8" stroke="#060406" stroke-width="1" transform="rotate(${Math.atan2(b.ty,b.tx)*180/Math.PI} ${b.x} ${b.y})"/>`;}},
];

const C2={rim:["#040204","#a8b0bc","#060406"], base:"#160a0c", trail:"#e8e8ec", hp:["#3a0008","#8a0a1e","#e04a5a"], sk:["#6a7080","#d8dce4","#ffffff"], skMid:"#2a2c34", glow:"#5a0010", cap:"silver", sheen:0};
const PAL=FX.map(e=>({...C2,name:e.name,note:e.note,fx:e.f}));

// 端の金具の色(上から下)
const CAPS={
 gold:["#fff2b8","#d8a83a","#8a5e14","#f0d080"],
 silver:["#ffffff","#b8c4d8","#5a6478","#dce4f0"],
 pearl:["#ffffff","#f0e8e0","#a8a098","#fff8f0"],
 gunmetal:["#c8d0dc","#6a7488","#2a303a","#9aa4b4"],
 copper:["#ffd8b8","#d0804a","#7a3a14","#f0a878"],
 bronze:["#e8d0a0","#9a7a40","#4a3414","#c8a870"],
 iron:["#8a8a90","#4a4a50","#1a1a1e","#6a6a70"],
 jade:["#c8e8c0","#5a8a5a","#1e3a24","#90b888"],
 rose:["#ffd8dc","#c06070","#5a1a24","#e8a0a8"],
};

function defs(i,p){
  let s=`<defs>`;
  if(p.cap){const c=CAPS[p.cap];
    s+=`<linearGradient id="${p.cap}${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset=".45" stop-color="${c[1]}"/><stop offset=".55" stop-color="${c[2]}"/><stop offset="1" stop-color="${c[3]}"/></linearGradient>`;}
  s+=`<linearGradient id="sk${i}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sk[2]}"/><stop offset=".35" stop-color="${p.sk[1]}"/><stop offset="1" stop-color="${p.sk[0]}"/></linearGradient>`;
  s+=`<filter id="gl${i}" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="4"/></filter>`;
  s+=`</defs>`;
  return s;
}

// 道に沿った「筒」: 太い暗い色 → 細い中の色 → もっと細い明るい色
function tube(d,len,w,c,attr=""){
  const da=`stroke-dasharray="${len} 5000"`;
  return `<path d="${d}" fill="none" stroke="${c[0]}" stroke-width="${w}" ${da} ${attr}/>`+
         `<path d="${d}" fill="none" stroke="${c[1]}" stroke-width="${w*0.62}" ${da} ${attr} transform="translate(0 -0.8)"/>`+
         `<path d="${d}" fill="none" stroke="${c[2]}" stroke-width="${w*0.2}" ${da} ${attr} transform="translate(0 -2.4)" opacity=".9"/>`;
}

function hpArc(i,p){
  let s="";
  // 縁
  if(p.rim.length===1){s+=`<path d="${FULL}" fill="none" stroke="${p.rim[0]}" stroke-width="18"/>`;}
  else{
    s+=`<path d="${FULL}" fill="none" stroke="${p.rim[0]}" stroke-width="22"/>`;
    s+=`<path d="${FULL}" fill="none" stroke="${p.rim[1]}" stroke-width="18"/>`;
    s+=`<path d="${FULL}" fill="none" stroke="${p.rim[2]}" stroke-width="15"/>`;
  }
  s+=`<path d="${FULL}" fill="none" stroke="${p.base}" stroke-width="12"/>`;
  if(p.flakes)for(let k=0;k<40;k++){const x=EX+((k*73)%(X1-EX)),y=EY-4+((k*29)%9);s+=`<circle cx="${x}" cy="${y}" r="${0.6+(k%3)*0.4}" fill="#d8b060" opacity="${0.25+(k%4)*0.12}"/>`;}
  s+=`<path d="${FULL}" fill="none" stroke="${p.trail}" stroke-width="12" stroke-dasharray="${S.tr*TOTAL} 5000"/>`;
  const hpc=low()?[p.hp[0],"#ff4a5a","#ffd0d0"]:p.hp;
  if(p.glow&&S.hp>0)s+=`<path d="${FULL}" fill="none" stroke="${p.glow}" stroke-width="14" stroke-dasharray="${S.hp*TOTAL} 5000" filter="url(#gl${i})" opacity="${low()?0.3+0.5*pulse():0.35}"/>`;
  s+=tube(FULL,S.hp*TOTAL,12,hpc);
  if(p.fx)s+=p.fx(i,p);
  // 先の目印
  if(S.hp>0&&S.hp<1){const L=S.hp*TOTAL,arcLen=R*(AE-A0);let x,y;
    if(L<arcLen){[x,y]=pol(R,A0+L/R);}else{x=EX+(L-arcLen);y=EY;}
    s+=`<circle cx="${x}" cy="${y}" r="3" fill="#fff"/>`;}
  // 端の金具
  if(p.cap){const g=`url(#${p.cap}${i})`;
    s+=P([[X1-4,EY-11],[X1+8,EY-11],[X1+16,EY],[X1+8,EY+11],[X1-4,EY+11]],`fill="${g}" stroke="#000" stroke-width="1"`);
    s+=`<circle cx="${X1+6}" cy="${EY}" r="3" fill="#000" opacity=".6"/>`;}
  else s+=P([[X1,EY-9],[X1+10,EY-9],[X1,EY+9],[X1-2,EY+9]],`fill="#0a0a0c"`);
  return s;
}

function skillBand(i,p){
  // 1本のゲージ(区切りなし)。1回分(20)たまっていれば明るい色、足りなければ暗い色
  const y=EY+12, x=EX+4, w=254, h=8, sl=5;
  const band=(a,b,dy=0)=>[[x+sl+w*a,y-dy],[x+sl+w*b,y-dy],[x+w*b,y+h+dy],[x+w*a,y+h+dy]];
  const r=S.skDisp/5, canUse=S.skDisp>=1-1e-6;
  let s="";
  if(p.cap)s+=P([[x+sl-3,y-3],[x+sl+w+5,y-3],[x+w+2,y+h+3],[x-6,y+h+3]],`fill="url(#${p.cap}${i})"`);
  s+=P([[x+sl-1.5,y-1.5],[x+sl+w+3,y-1.5],[x+w+0.5,y+h+1.5],[x-4,y+h+1.5]],`fill="${p.rim.length>1?p.rim[2]:"#0a0a0c"}"`);
  s+=P(band(0,1),`fill="${p.base}"`);
  if(r>=1&&p.glow)s+=P(band(0,1,2),`fill="${p.glow}" filter="url(#gl${i})" opacity="${0.35+0.25*pulse(3)}"`);
  if(r>0)s+=P(band(0,r),`fill="${canUse?`url(#sk${i})`:p.skMid}"`);
  if(r>0&&canUse)s+=P([[x+sl+1,y+1],[x+sl+w*r-1,y+1],[x+sl+w*r-1.2,y+2.4],[x+sl+0.8,y+2.4]],'fill="#fff" opacity=".5"');
  if(r>0&&r<1)s+=P(band(r-0.004,r),'fill="#fff" opacity=".85"');
  const pp=Math.max(...S.ready);
  if(pp>0&&r>0)s+=P(band(0,r,3*pp),`fill="#fff" opacity="${pp*0.8}"`);
  if(S.use>0){const a=S.useIdx*0.2,b=a+0.2,e=6*(1-S.use);
    s+=P(band(a,b,e),`fill="#fff" opacity="${S.use*0.9}"`);}
  return s;
}

const grid=document.getElementById("grid");
const cards=PAL.map((p,i)=>{
  const c=document.createElement("div");c.className="card";
  c.innerHTML=`<div class="cap"><span class="no">C${i}</span><b>${p.name}</b><span>${p.note}</span></div>
  <div class="stage bg0">
  <div class="ult">
   <img class="base" src="${ULT.base}">
   <img class="col dim" src="${ULT.col}">
   <img class="col fill" src="${ULT.col}" style="-webkit-mask:conic-gradient(#000 0 ${ULT_RATE*360}deg,transparent 0);mask:conic-gradient(#000 0 ${ULT_RATE*360}deg,transparent 0)">
   <img class="ring" src="${ULT.ring}">
  </div><svg width="640" height="170" viewBox="0 0 640 170"></svg></div>`;
  grid.appendChild(c);
  return {svg:c.querySelector("svg"),stage:c.querySelector(".stage"),p,i};
});

const $=id=>document.getElementById(id);
$("hp").oninput=e=>{S.hp=e.target.value/100;};
$("sk").oninput=e=>{S.sk=e.target.value/20;};
$("dmg").onclick=()=>{const _b=S.hp;S.hp=clamp(S.hp-0.18);S.trWait=40;S.hit=1;S.cut={a:S.hp,b:_b,t:0};$("hp").value=S.hp*100;};
$("heal").onclick=()=>{S.hp=clamp(S.hp+0.3);S.tr=Math.max(S.tr,S.hp);$("hp").value=S.hp*100;};
$("use").onclick=()=>{if(S.sk>=1){S.sk-=1;S.useIdx=Math.floor(S.sk+1e-6);S.use=1;}$("sk").value=S.sk*20;};
$("gain").onclick=()=>{S.sk=Math.min(5,S.sk+0.35);$("sk").value=S.sk*20;};
$("bgsel").onchange=e=>cards.forEach(c=>c.stage.className="stage "+e.target.value);

let last=performance.now(), prevFull=Math.floor(S.skDisp);
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000);last=now;S.t+=dt;
  if(S.tr<S.hp)S.tr=S.hp;
  if(S.trWait>0)S.trWait-=dt*60;else S.tr+=(S.hp-S.tr)*0.08;
  S.skDisp+=(S.sk-S.skDisp)*0.15;if(Math.abs(S.sk-S.skDisp)<0.002)S.skDisp=S.sk;
  const full=Math.floor(S.skDisp+1e-6);
  if(full>prevFull)for(let k=prevFull;k<full;k++)S.ready[k]=1;
  prevFull=full;
  for(let k=0;k<5;k++)S.ready[k]=Math.max(0,S.ready[k]-dt*3);
  S.use=Math.max(0,S.use-dt*4);S.hit=Math.max(0,(S.hit||0)-dt*3);if(S.cut)S.cut.t+=dt;
  for(const c of cards)c.svg.innerHTML=defs(c.i,c.p)+hpArc(c.i,c.p)+skillBand(c.i,c.p);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
