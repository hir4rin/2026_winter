<style>

<div class="wrap">
<h1>ガードブレイク: 敵の武器を奪って血殺</h1>
<p>流れ: ガードを割る → <b>敵の武器が手から弾かれて宙に舞う</b>(チャンスのスロー0.2の間、空中でゆっくり回る) → Y で<b>跳び上がって掴む</b> → 奪った武器で空から決める → <b>血殺</b>(ゲームと同じく背景が赤・敵が黒・白い爆発・「血」「殺」の文字。文字の画像はゲームのもの)。<br>
左がプレイヤー、赤い × の敵が割った相手、奥の2体はまわりの敵。<code>#W,170,1</code> のように書くと「案,フレーム,巻き込み(0/1)」で止まる。<code>#all,170,1</code> で全部並べる。</p>
<canvas id="cv" width="640" height="360"></canvas>
<div id="grid"></div>
<div class="row" id="plans"><b>剣の敵</b></div>
<div class="row" id="plansB"><b>バズーカの敵</b></div>
<div class="row"><b>まわりの敵</b><button id="mk0">巻き込まない</button><button id="mk1">巻き込む</button></div>
<div class="row">
<button id="play">一時停止</button>
<input type="range" id="seek" min="0" max="279" value="0">
<label><input type="checkbox" id="slow"> 0.5倍</label>
<button id="allb">全部並べる</button>
</div>

<dl id="desc"></dl>

function mix(a,b,k){const o={face:k<.5?a.face:b.face};for(const n of['x','air','lean','bl','bl2'])o[n]=lerp(a[n],b[n],k);for(const n of['th','sh','ua','fa'])o[n]=[lerp(a[n][0],b[n][0],k),lerp(a[n][1],b[n][1],k)];o.sc=lerp(a.sc||1,b.sc||1,k);return o}
function samp(keys,t){

}
function joints(p){

 const dep=Math.max(...[0,1].map(i=>Math.cos(p.th[i]*D2R)*TH+Math.cos(p.sh[i]*D2R)*TH));
 const hip=[p.x,GY-Math.max(dep,4*s)-p.air];
 const tv=[Math.sin(p.lean*D2R)*f,-Math.cos(p.lean*D2R)];
 const sh=[hip[0]+tv[0]*TO,hip[1]+tv[1]*TO],head=[hip[0]+tv[0]*(TO+11*s),hip[1]+tv[1]*(TO+11*s)];
 const leg=i=>{const k=dv(p.th[i]),kn=[hip[0]+k[0]*TH,hip[1]+k[1]*TH],q=dv(p.sh[i]);return[kn,[kn[0]+q[0]*TH,kn[1]+q[1]*TH]]};

 const bd=[Math.cos(p.bl*D2R)*f,Math.sin(p.bl*D2R)],bd2=[Math.cos(p.bl2*D2R)*f,Math.sin(p.bl2*D2R)];

}

// 案ごとの当たり(u は Y を押してからのフレーム)
function hitsOf(plan,mkOn){
 const H=[];
 if(plan==='T')H.push({u:34,who:'T'});
 if(plan==='W'){H.push({u:30,who:'T'});H.push({u:38,who:mkOn?'N1':'T'});H.push({u:46,who:'T'});if(mkOn){H.push({u:47,who:'N1'});H.push({u:48,who:'N2'})}}

 if(plan==='S2'){H.push({u:30,who:'T'});if(mkOn){H.push({u:38,who:'N1'});H.push({u:39,who:'N2'})}else H.push({u:38,who:'T'});H.push({u:52,who:'T'})}
 if(plan==='S3'){const tg=mkOn?['T','N1','N2']:['T'];for(let i=0;i<14;i++)H.push({u:38+(i%9),who:tg[i%tg.length],blade:i})}

 return H;
}
// 演出の時間(決めの後はスロー0.25で40F)
const KD=40;
function poseTime(u,K){if(u<K)return u;const a=u-K;return a<KD?K+a*.25:K+KD*.25+(a-KD)}

function enemyPose(id,plan,t,H,K,kills){
 const isT=id==='T',e=ENEMIES.find(v=>v.id===id),boss=false;
 const m=n=>o=>mk(n,Object.assign({x:e.x,face:-1},o));
 const w=wt(t);
 if(isT&&t<YP){const pre=[[0,m('eguard')({x:EX})],[BRK,m('eguard')({x:EX})],[BRK+6,m('ebreak')({x:EX+10}),'o'],[CH0,m('ebreak')({x:EX+12})],[wt(YP),m('estag')({x:EX+12})]];const p=samp(pre,w);if(t>=CH0)p.lean+=Math.sin(w*.5)*2;return p}

 const u=t-YP,uu=poseTime(u,K);

 for(const h of H)if(h.who===id&&u>=h.u&&u<h.u+8&&!(kills.has(id)&&u>=K)){const k=(u-h.u)/8;p=mix(m('ehit')({x:e.x+6}),p,ease(k))}

  if(u<hitU){const k=(u-rel)/8;return{mode:'air',x:lerp(h0[0],c[0]-10,k),y:lerp(h0[1],c[1],k)-Math.sin(k*Math.PI)*10,ang:-1.2+(u-rel)*1.4}}

 const k=ease(cl(a/12));let x=lerp(s0[0],apex[0],k),y=lerp(s0[1],apex[1],k)-Math.sin(k*Math.PI)*30;

 // 血殺の背景(ステージの赤い色変え)・ビネット・白い爆発・線・文字(敵の後ろ)
 if(br>0){
  g.save();g.globalAlpha=br;const rb=g.createLinearGradient(0,0,0,360);rb.addColorStop(0,'#8a0c16');rb.addColorStop(.75,'#3a0208');rb.addColorStop(1,'#1a0104');g.fillStyle=rb;g.fillRect(-20,-20,680,400);
  g.fillStyle='rgba(20,0,2,.55)';g.fillRect(-20,GY,680,80);g.restore();
  g.save();g.globalAlpha=br*.85;const vg=g.createRadialGradient(320,180,140,320,180,400);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,1)');g.fillStyle=vg;g.fillRect(-20,-20,680,400);g.restore();
  let ii=0;for(const id of kills){whiteBurst(g,...chestOf(id),ka-(id==='T'?0:2),br,ii++)}
  slashLines(g,...chestOf('T'),ka,br);
  kessatsuText(g,ka,br);
 }
 const pp=playerPose(plan,t,K);
 // 敵
 for(const e of ENEMIES){const p=enemyPose(e.id,plan,t,HT,K,kills),dark=br>.5;
  const col=dark?[6,5,8]:e.id==='T'?[132,138,155]:[112,116,130];
  const wpn=e.id==='T'?(t<BRK?(baz?'ebaz':'sword'):null):'sword';
  fig(g,p,col,{dark,weapon:wpn,swordCol:'rgba(170,175,185,1)'})}
 // プレイヤー
 const pjPre=joints(pp);
 const ws=weaponState(plan,t,K,pjPre);
 const held=ws&&ws.mode==='held'?(baz?'baz':'sword'):null;
 const pj=fig(g,pp,[232,228,220],{scarf:true,t,weapon:'sword',held,empty:plan==='M'&&u>=26});
 // 宙の武器・刺さった剣
 if(ws&&ws.mode==='air'){if(ws.glint){g.save();g.globalCompositeOperation='lighter';glow(g,ws.x,ws.y,26+Math.sin(t*.3)*4,[255,230,190],.35);g.restore()}
  if(baz)drawBaz(g,ws.x,ws.y,ws.ang);else drawSword(g,ws.x,ws.y,ws.ang,{col:'rgba(200,205,215,1)'})}
 if(ws&&ws.mode==='stuck'){const ej=joints(enemyPose('T',plan,t,HT,K,kills)),c=[(ej.sh[0]+ej.hip[0])/2,(ej.sh[1]+ej.hip[1])/2];drawSword(g,c[0]-40,c[1]-24,.55,{len:64,w:3,col:'rgba(225,230,240,1)'})}
 // ブレイクの瞬間
 const ch=chestOf('T');ch[0]-=8;
 flash(g,ch[0],ch[1],t-BRK);shards(g,ch[0],ch[1],t-BRK,{n:40,v:4.5,gr:.16,seed:1});
 // チャンス中
 if(t>=CH0-2&&t<YP+10){const k=t<YP?cl((t-CH0+2)/8):1-(t-YP)/10;g.save();g.fillStyle=`rgba(30,50,120,${.22*k})`;g.fillRect(-20,-20,680,400);g.restore()}
 chanceUI(g,ch[0],ch[1]-4,t);
 if(t>=YP)FX[plan](g,u,pj,HT,K,mkOn);
 // 当たりの光
 for(const h of HT){const a=u-h.u;if(a<0||a>10)continue;const c=chestOf(h.who);g.save();g.globalCompositeOperation='lighter';glow(g,c[0],c[1],30,WHITE,(1-a/10)*.9);g.restore();if(br<.5)shards(g,c[0],c[1],a,{n:10,v:3,gr:.15,seed:h.u*7+(h.blade||0),life:20,c:[255,120,130],dk:[120,10,20]})}
 g.restore();
 // 文字
 g.save();g.setTransform(W/640,0,0,H/360,0,0);g.fillStyle='rgba(232,228,220,.85)';g.font='12px "Yu Gothic UI",sans-serif';g.fillText(PL[plan].name+(mkOn?' / 巻き込む':' / 巻き込まない'),12,20);
 g.fillStyle='rgba(160,154,168,.9)';g.fillText(phase(plan,t,K)+`  ${t}F`,12,38);if(t>=CH0&&t<YP){g.fillStyle='rgba(127,180,255,.9)';g.fillText('スロー ×0.2',560,20)}
 if(u>=K&&u<K+KD){g.fillStyle='rgba(255,200,200,.9)';g.fillText('スロー ×0.25',556,20)}g.restore();
}
function phase(plan,t,K){const u=t-YP;if(t<BRK)return'攻撃 → ガードに当たる';if(t<CH0)return'割れた瞬間: 武器が宙に舞う';if(t<YP)return'チャンス中(Yを押す)';if(u<CATCH)return'跳んで掴む';if(u<K)return'奪った武器で決める';return'血殺'}

// ---- 血殺の2D ----
function whiteBurst(g,x,y,a,br,seed){if(a<0)return;const k=ease(cl(a/4))*(1+Math.min(a,66)*.003);g.save();g.globalAlpha=br;g.fillStyle='#fff';g.strokeStyle='#fff';g.lineCap='round';
 const base=-0.5;
 for(let i=0;i<46;i++){const s=seed*100+i,an=base+(nz(s)-.5)*1.5,L=(24+nz(s+1)*90)*k,w=1+nz(s+2)*4;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(an)*L,y+Math.sin(an)*L);g.stroke();
  const r=(1.5+nz(s+3)*5)*k;g.beginPath();g.arc(x+Math.cos(an)*L*(1+nz(s+4)*.4),y+Math.sin(an)*L*(1+nz(s+4)*.4),r,0,7);g.fill()}
 g.beginPath();g.ellipse(x+10*k,y-4*k,26*k,16*k,base,0,7);g.fill();
 for(let i=0;i<70;i++){const s=seed*300+i,an=base+(nz(s)-.5)*2,L=(50+nz(s+5)*120)*k;g.beginPath();g.arc(x+Math.cos(an)*L,y+Math.sin(an)*L,.6+nz(s+6)*1.4,0,7);g.fill()}
 g.restore()}
function slashLines(g,x,y,a,br){if(a<0)return;g.save();g.globalAlpha=br;g.fillStyle='#fff';
 [[0,1,0],[1,.6,.12],[2,.45,-.1]].forEach(([i,s,da])=>{const k=ease(cl((a-i)/4));if(k<=0)return;const L=520*s*k,an=-0.5+da;g.save();g.translate(x,y);g.rotate(an);g.beginPath();g.moveTo(-L*.45,0);g.lineTo(0,-3*s-1);g.lineTo(L*.55,0);g.lineTo(0,3*s+1);g.fill();g.restore()});g.restore()}
function kessatsuText(g,a,br){if(a<2)return;const k=ease(cl((a-2)/5)),al=br*k;g.save();g.globalAlpha=al;
 const sc=lerp(1.25,1,k);
 if(imgs.splash){const w=imgs.splash.width*.5*sc,h=imgs.splash.height*.5*sc;g.save();g.translate(640/15,360-75);g.rotate(Math.PI/4);g.drawImage(imgs.splash,-w/2,-h/2,w,h);g.restore()}
 if(imgs.blood){const w=imgs.blood.width*.4*sc,h=imgs.blood.height*.4*sc;g.save();g.translate(540,90);g.rotate(-Math.PI/12);g.drawImage(imgs.blood,-w/2,-h/2,w,h);g.restore()}
 if(imgs.satsu){const w=imgs.satsu.width*.25*sc,h=imgs.satsu.height*.25*sc;g.drawImage(imgs.satsu,384-w/2,260-h/2,w,h)}
 g.restore()}

// ---- 案ごとのエフェクト ----
function wave(g,u,u0,dur,from,to,big,c){const a=u-u0;if(a<0||a>dur+4)return;const k=cl(a/dur),x=lerp(from[0],to[0],ease(k)),y=lerp(from[1],to[1],ease(k)),an=Math.atan2(to[1]-from[1],to[0]-from[0]),al=a>dur?1-(a-dur)/4:1;
 for(let i=3;i>=1;i--){const kk=cl((a-i*1.2)/dur);crescent(g,lerp(from[0],to[0],ease(kk)),lerp(from[1],to[1],ease(kk)),an,(big?30:22),5,al*.18*(4-i),c)}
 crescent(g,x,y,an,big?30:22,big?8:6,al,c)}
function xwave(g,u,u0,dur,from,to,big){const a=u-u0;if(a<0||a>dur+4)return;const k=cl(a/dur),x=lerp(from[0],to[0],ease(k)),y=lerp(from[1],to[1],ease(k)),an=Math.atan2(to[1]-from[1],to[0]-from[0]),al=a>dur?1-(a-dur)/4:1,R=big?34:24;
 g.save();g.translate(x,y);g.rotate(an);g.globalCompositeOperation='lighter';g.lineCap='round';
 for(const s of[1,-1]){g.save();g.rotate(s*.75);g.strokeStyle=rgba(s>0?SIL:[255,150,160],al);g.lineWidth=big?6:4;g.beginPath();g.moveTo(-R,0);g.lineTo(R,0);g.stroke();g.restore()}
 glow(g,0,0,R*1.2,[255,220,230],al*.4);g.restore();
 for(let i=1;i<=3;i++){const kk=cl((a-i*1.3)/dur);g.save();g.globalCompositeOperation='lighter';glow(g,lerp(from[0],to[0],ease(kk)),lerp(from[1],to[1],ease(kk)),R*.8,[220,210,255],al*.12*(4-i));g.restore()}}
function hand(pj,i){return pj.arms[i][1]}
const FX={
 T(g,u,pj){ if(u>=24&&u<27){const h=hand(pj,1);g.save();g.globalCompositeOperation='lighter';glow(g,h[0],h[1],22,WHITE,.8);g.restore()}
  if(u>=26&&u<34){const c=chestOf('T');streak(g,hand(pj,1)[0],hand(pj,1)[1],c[0],c[1],u-26,10,[220,220,240],2)}},
 W(g,u,pj,HT,K,mkOn){const fr=[pj.sh[0]+20,pj.sh[1]+10];
  wave(g,u,22,8,fr,chestOf('T'),false,SIL);wave(g,u,30,8,fr,chestOf(mkOn?'N1':'T'),false,SIL);
  wave(g,u,38,8,fr,chestOf('T'),true,[255,210,220]);if(mkOn){wave(g,u,38,9,fr,chestOf('N1'),true,[255,210,220]);wave(g,u,38,10,fr,chestOf('N2'),true,[255,210,220])}},
 S1(g,u,pj,HT,K,mkOn){const fr=[pj.sh[0]+20,pj.sh[1]+10];
  xwave(g,u,26,8,fr,chestOf('T'),false);xwave(g,u,34,8,fr,chestOf('T'),true);if(mkOn){xwave(g,u,34,9,fr,chestOf('N1'),true);xwave(g,u,34,10,fr,chestOf('N2'),true)}},
 S2(g,u,pj,HT,K,mkOn){const fr=[pj.sh[0]+20,pj.sh[1]+10];
  wave(g,u,22,8,fr,chestOf('T'),false,SIL);if(mkOn){wave(g,u,30,8,fr,chestOf('N1'),false,SIL);wave(g,u,30,9,fr,chestOf('N2'),false,SIL)}else wave(g,u,30,8,fr,chestOf('T'),false,SIL);
  if(u>=42&&u<45){const h=hand(pj,1);g.save();g.globalCompositeOperation='lighter';glow(g,h[0],h[1],22,WHITE,.8);g.restore()}
  if(u>=44&&u<52){const c=chestOf('T');streak(g,hand(pj,1)[0],hand(pj,1)[1],c[0],c[1],u-44,10,[220,220,240],2)}},
 S3(g,u,pj,HT,K,mkOn){const h0=[pj.sh[0]+44,pj.sh[1]+30];
  if(u>=30&&u<40){g.save();g.globalCompositeOperation='lighter';glow(g,h0[0],h0[1],50,WHITE,1-(u-30)/10);g.restore();shards(g,h0[0],h0[1],u-30,{n:16,v:3,gr:.1,seed:500,life:16,c:SIL})}
  for(const h of HT){if(h.blade===undefined)continue;const i=h.blade,c=chestOf(h.who);c[0]+=(nz(i+600)-.5)*30;const up=[h0[0]+(nz(i+700)-.5)*120,h0[1]-50-nz(i+710)*50];
   const a=u-30;if(a<0)continue;let x,y,ang;
   if(a<4){const k=ease(a/4);x=lerp(h0[0],up[0],k);y=lerp(h0[1],up[1],k);ang=a*1.2+i}
   else{const k=cl((u-34)/(h.u-34));x=lerp(up[0],c[0],k*k);y=lerp(up[1],c[1]+10,k*k);ang=Math.atan2(c[1]+10-up[1],c[0]-up[0])}
   if(u<h.u+30){drawSword(g,x-Math.cos(ang)*14,y-Math.sin(ang)*14,ang,{len:18,w:2,col:'rgba(225,230,240,1)'});if(a>=4&&u<h.u)streak(g,x-Math.cos(ang)*30,y-Math.sin(ang)*30,x,y,0,1,[200,205,230],1.5)}}},
 M(g,u,pj,HT){const j=pj,mz=[hand(j,1)[0]+j.bd2[0]*34,hand(j,1)[1]+j.bd2[1]*34];
  if(u>=26&&u<34){g.save();g.globalCompositeOperation='lighter';glow(g,mz[0],mz[1],34*(1-(u-26)/8),[255,200,120],1);const bb=[hand(j,1)[0]-j.bd2[0]*30,hand(j,1)[1]-j.bd2[1]*30];glow(g,bb[0],bb[1],40*(1-(u-26)/8),[200,190,180],.6);g.restore()}
  for(const h of HT){if(h.mis===undefined)continue;const i=h.mis,c=chestOf(h.who);c[0]+=(h.who==='T'?(i-2)*16:0);c[1]+=(h.who==='T'?(i%2)*14:0);
   const a=u-26;if(a<0)continue;const k=cl(a/(h.u-26));const ctrl=[mz[0]+60+i*14,mz[1]-60-(i%3)*40+i*6];
   const bz=q=>[(1-q)*(1-q)*mz[0]+2*(1-q)*q*ctrl[0]+q*q*c[0],(1-q)*(1-q)*mz[1]+2*(1-q)*q*ctrl[1]+q*q*c[1]];
   if(u<h.u){for(let s=1;s<=6;s++){const q=cl(k-s*.06);if(q<=0)break;const p=bz(q);g.fillStyle=`rgba(120,114,120,${.35*(1-s/7)})`;g.beginPath();g.arc(p[0],p[1],3+s*1.2,0,7);g.fill()}
    const p=bz(k),p2=bz(Math.max(0,k-.03)),an=Math.atan2(p[1]-p2[1],p[0]-p2[0]);g.save();g.translate(p[0],p[1]);g.rotate(an);g.fillStyle='#8a7a58';g.fillRect(-7,-2,10,4);g.fillStyle='#b0a070';g.beginPath();g.moveTo(3,-2.5);g.lineTo(8,0);g.lineTo(3,2.5);g.fill();g.restore();
    g.save();g.globalCompositeOperation='lighter';glow(g,p[0]-Math.cos(an)*8,p[1]-Math.sin(an)*8,8,[255,180,90],.9);g.restore()}
   else{const e=u-h.u;if(e<36){g.save();g.globalCompositeOperation='lighter';glow(g,c[0],c[1],22+e*3,[255,150,60],.9*(1-e/36));glow(g,c[0],c[1],12+e,[255,240,200],cl(1-e/8));g.restore();ring(g,c[0],GY,e,20,90,[255,170,90],4);
     for(let s=0;s<8;s++){const an=nz(i*20+s)*6.28,v=1.5+nz(i*20+s+9)*2;glow(g,c[0]+Math.cos(an)*v*e,c[1]+Math.sin(an)*v*e*.6-e*.6,8+e*.5,[70,64,74],.45*(1-e/36))}}}}}
};

// ---- 画面 ----
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let plan='S1',mkOn=1,t=0,playing=true,acc=0,all=false;
const pb=document.getElementById('plans'),pbB=document.getElementById('plansB'),seek=document.getElementById('seek'),grid=document.getElementById('grid');
seek.max=TOTAL-1;
ORDER.forEach(k=>{const b=document.createElement('button');b.textContent=PL[k].name;b.onclick=()=>{plan=k;all=false;sync()};b.dataset.k=k;(k==='M'?pbB:pb).appendChild(b)});
document.getElementById('mk0').onclick=()=>{mkOn=0;sync()};document.getElementById('mk1').onclick=()=>{mkOn=1;sync()};
document.getElementById('play').onclick=()=>{playing=!playing;sync()};
document.getElementById('allb').onclick=()=>{all=!all;sync()};
seek.oninput=()=>{t=+seek.value;playing=false;sync()};
const subs=ORDER.map(k=>{const d=document.createElement('div'),c=document.createElement('canvas');c.width=640;c.height=360;d.appendChild(c);const s=document.createElement('span');s.textContent=PL[k].name;d.appendChild(s);grid.appendChild(d);return{k,c,g:c.getContext('2d')}});
function sync(){
 document.body.classList.toggle('all',all);
 [...document.querySelectorAll('#plans button,#plansB button')].forEach(b=>b.classList.toggle('on',!all&&b.dataset.k===plan));
 document.getElementById('mk0').classList.toggle('on',!mkOn);document.getElementById('mk1').classList.toggle('on',!!mkOn);
 document.getElementById('play').textContent=playing?'一時停止':'再生';
 document.getElementById('allb').classList.toggle('on',all);
 const dl=document.getElementById('desc');dl.innerHTML='';
 for(const[a,b]of[...COMMON,...(all?[]:PL[plan].d)]){const dt=document.createElement('dt');dt.textContent=a;const dd=document.createElement('dd');dd.textContent=b;dl.append(dt,dd)}
 draw();
}
function draw(){
 seek.value=t;document.getElementById('ph').textContent=`${t} / ${TOTAL-1}F(60fps)`;
 if(all)subs.forEach(s=>render(s.g,s.k,mkOn,t));else render(g,plan,mkOn,t);
}
let last=performance.now();
function loop(now){const dt=now-last;last=now;if(playing){acc+=dt*(document.getElementById('slow').checked?.5:1)/16.667;while(acc>=1){acc--;t=(t+1)%TOTAL}draw()}requestAnimationFrame(loop)}
// #S1,170,1 / #all,170,0
(function(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return;const[a,b,c]=h.split(',');if(a==='all')all=true;else if(PL[a])plan=a;if(b!==undefined&&b!==''){t=Math.max(0,Math.min(TOTAL-1,+b|0));playing=false}if(c!==undefined)mkOn=+c?1:0})();
sync();requestAnimationFrame(loop);
</script>
