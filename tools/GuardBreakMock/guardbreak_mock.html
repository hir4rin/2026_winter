<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ガードブレイク演出案</title>
<style>
:root{--bg:#121219;--fg:#e8e4dc;--sub:#a09aa8;--line:#3a3646;--acc:#8a6cff}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Yu Gothic UI","Meiryo",sans-serif;padding:16px}
.wrap{max-width:980px;margin:0 auto}
canvas{width:100%;display:block;border-radius:8px;background:#000}
.row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;align-items:center}
.row b{font-size:13px;color:var(--sub);font-weight:500;min-width:6em}
button{background:transparent;color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:14px;cursor:pointer}
button:hover{border-color:var(--sub)}
button.on{border-color:var(--acc);background:#1e1838}
label{font-size:13px;color:var(--sub)}
input[type=range]{flex:1;min-width:200px}
#ph{font-size:13px;color:var(--sub);min-height:20px}
#desc{font-size:13px;line-height:1.8}
#desc dt{color:var(--acc);margin-top:6px}
#desc dd{margin:0 0 0 1em;color:var(--sub)}
h1{font-size:18px;font-weight:500;margin:0 0 4px}
p{font-size:13px;color:var(--sub);margin:0 0 12px;line-height:1.7}
#grid{display:none;grid-template-columns:repeat(2,1fr);gap:8px}
#grid div{font-size:12px;color:var(--sub)}
body.all #cv{display:none} body.all #grid{display:grid}
</style>
</head>
<body>
<div class="wrap">
<h1>ガードブレイクの演出案(打ち上げを普段のコンボに移したあと)</h1>
<p>流れ: 強攻撃でガードを割る → <b>崩れた瞬間</b> → チャンス(スロー0.2・×とYのUI) → Y で<b>山場の一撃</b>。棒人間は今のアニメの名前をなぞったもの(左がプレイヤー、右が敵)。<br>
紫の閃光・ガラス片は今の <code>GuardBreakFlash</code> / <code>GuardBreakShards</code>。<code>#A,150,1</code> のように書くと「一撃の案,フレーム,瞬間の案(0〜3)」で止まる。<code>#all,150</code> で一撃を全部並べる。</p>
<canvas id="cv" width="640" height="360"></canvas>
<div id="grid"></div>
<div class="row" id="brks"><b>崩れた瞬間</b></div>
<div class="row" id="plans"><b>山場の一撃</b></div>
<div class="row">
<button id="play">一時停止</button>
<input type="range" id="seek" min="0" max="259" value="0">
<label><input type="checkbox" id="slow"> 0.5倍</label>
<button id="allb">全部並べる</button>
</div>
<div id="ph"></div>
<dl id="desc"></dl>
</div>
<script>
// ---- 時間(60fps) ----
const GY=300,BRK=20,CH0=28,YP=98,TOTAL=260,SLOW=.2;
const wt=t=>t<CH0?t:t<YP?CH0+(t-CH0)*SLOW:CH0+(YP-CH0)*SLOW+(t-YP); // スローがかかる世界の時間
const WYP=wt(YP);

const BRKS=[
 {name:'今のまま(閃光＋ガラス片)',d:[['崩れた瞬間','紫の閃光(芯・もや・放射の筋・横一文字)とガラス片だけ。']]},
 {name:'① 武器を弾く',d:[['崩れた瞬間','Block_Hit_Break に合わせて敵の刀が手から外れ、回りながら後ろへ飛んで地面に刺さる。スローの間も空中でゆっくり回るので「丸腰＝今がチャンス」が読める。'],['作り','Kingmech のガトリングを切り離したときの作り(BossPartThrow)が使える。銃の敵は銃を飛ばす。ボスは部位の切り離しへ。']]},
 {name:'② 「崩」の字',d:[['崩れた瞬間','死亡演出の「死」と同じ筆の字(KSO黒龍爽)を敵の右上に一瞬だけ押す。色は白銀に紫のふち。'],['気になる点','チャンスの × と近い所に出るので、出す時間は短く(0.8秒)。確殺・暗殺には字が無いので区別にはなる。']]},
 {name:'①＋②',d:[['崩れた瞬間','武器が飛ぶのと同時に「崩」。いちばん分かりやすいが、閃光・ガラス片・UI と合わせて画面がにぎやか。']]}
];
const PL={
A:{name:'A 兜割り(叩きつけ)',d:[
 ['プレイヤー','Boss_LeapSlash: しゃがんで踏み切り → 敵の上で振りかぶって止まる → 急降下で叩き斬る。'],
 ['敵','Knock_Down_Start → Loop(仰向けに倒れる)。'],
 ['エフェクト','着地で6Fのヒットストップ、地面のひび(StartLand)、紫のガラス片が地面から噴き上がる、GhostSkill3_Impact の衝撃の輪。'],
 ['良い点 / 気になる点','打ち上げ(上)と正反対の「下」なので見分けがいちばん付く。素材がそろっていて新しいアニメが要らない。Kingmech のトドメと同じアニメなので高さか色で差を付ける。']]},
B:{name:'B 胸を貫く',d:[
 ['プレイヤー','StabChest_Attacker の刺す所まで → 刺したまま止まる → 蹴って抜く。'],
 ['敵','StabChest_Victim の途中 → Hit_Large_B で奥へ吹き飛ぶ。'],
 ['エフェクト','背中から紫の光の筋とガラス片が抜ける。蹴りで吹き飛ぶ敵にガラス片の尾。'],
 ['良い点 / 気になる点','組み合わせのアニメで重い。そのままだと暗殺に見えるので、刺したあと蹴る形に変える。']]},
C:{name:'C 斬り抜け・納刀',d:[
 ['プレイヤー','RunSlashFinisher_Attacker: 敵の横を走り抜けて斬る → 背を向けたままゆっくり納刀。'],
 ['敵','止まったまま。納刀の「チン」で斜めの線が光って割れ、膝をついて倒れる。'],
 ['エフェクト','GhostDash の残像＋GleamLight の白い線。納刀で鍔に小さな光 → 遅れて紫の破裂。'],
 ['良い点 / 気になる点','「遅れて割れる」気持ちよさ。地上弱スキル(斬り抜け)と見た目が近い。']]},
D:{name:'D 居合の一閃',d:[
 ['プレイヤー','Power_Attack_Start を短く(腰に刀) → Combo_Attack_04_04 で抜き打ち。'],
 ['敵','Hit_Large_F で後ろへ飛ぶ。'],
 ['エフェクト','画面を3Fだけ白黒反転 → 画面の端から端までの横一文字(GuardBreakFlash の Line を大きく)。'],
 ['良い点 / 気になる点','短いので雑魚で何度見ても疲れない。溜め攻撃の見た目に近い。']]},
E:{name:'E 乱舞',d:[
 ['プレイヤー','Combo_Attack_03 / 04 をスローの中で自動でつなぎ、敵の左右へ瞬間移動しながら5回斬る → 最後に大きく一太刀。'],
 ['敵','Hit_Combat_F/L/R を繰り返す → 最後に吹き飛ぶ。'],
 ['エフェクト','SwordSlashSpin の弧(白銀・紫)、残像、最後の一太刀でガラス片。ゲームではカメラが周りを回る。'],
 ['良い点 / 気になる点','派手だが長い。何度も見ると疲れるのでボス用。']]},
F:{name:'F 部位を斬る(ボス)',d:[
 ['プレイヤー','今の GuardBreakAttack1(切り上げ)で腕を斬り飛ばす → 跳んで蹴り返す。'],
 ['敵','腕(ガトリング)が回りながら上へ → 蹴り返されて胸で爆発し、よろける。'],
 ['エフェクト','Kingmech のガトリングと同じ流れ(切れる → 回る → 投げ返して爆発)。'],
 ['良い点 / 気になる点','ボスは部位を斬る、雑魚は A〜E、と分ける前提。']]},
L:{name:'比較: 今の打ち上げ',d:[
 ['今','GuardBreakAttack0/1: 切り上げで敵を打ち上げて追う。'],
 ['問題','打ち上げを普段のコンボ(X→Y)でも出すと、ブレイクのご褒美に見えなくなる。']]}
};
const ORDER=['A','B','C','D','E','F','L'];

// ---- 道具 ----
const cl=v=>v<0?0:v>1?1:v, lerp=(a,b,k)=>a+(b-a)*k, ease=k=>1-Math.pow(1-k,3), sm=k=>k*k*(3-2*k), seg=(t,a,b)=>cl((t-a)/(b-a));
const nz=i=>{const s=Math.sin(i*12.9898+78.233)*43758.5453;return s-Math.floor(s)};
const rgba=(c,a)=>`rgba(${c[0]},${c[1]},${c[2]},${a})`;
const D2R=Math.PI/180;

// ---- 体(角度: 体の向きで 0=真下、+が前。胴は 0=真上。刀は 0=前、-90=上) ----
const BASE={x:0,air:0,lean:0,th:[0,0],sh:[0,0],ua:[0,0],fa:[0,0],bl:0,face:1};
const P={
 stand:{lean:6,th:[18,-14],sh:[4,-10],ua:[25,-10],fa:[70,40],bl:-40},
 wind:{lean:-5,th:[22,-18],sh:[6,-14],ua:[160,140],fa:[190,160],bl:-160},
 strike:{lean:20,th:[32,-22],sh:[0,-18],ua:[75,20],fa:[90,40],bl:35},
 crouch:{lean:30,th:[65,-25],sh:[-15,15],ua:[40,0],fa:[80,30],bl:-20},
 crouchLow:{lean:30,th:[65,-25],sh:[-15,15],ua:[10,0],fa:[20,30],bl:150},
 jump:{lean:0,th:[60,15],sh:[-30,-40],ua:[170,150],fa:[195,170],bl:-170},
 slam:{lean:40,th:[75,-20],sh:[-10,15],ua:[105,30],fa:[115,50],bl:80},
 thrustPre:{lean:15,th:[40,-25],sh:[5,-20],ua:[10,-10],fa:[40,30],bl:180},
 thrust:{lean:25,th:[50,-35],sh:[10,-30],ua:[85,-20],fa:[90,30],bl:0},
 kick:{lean:-15,th:[95,-10],sh:[85,0],ua:[60,-20],fa:[80,20],bl:-30},
 dashEnd:{lean:30,th:[60,-40],sh:[10,-30],ua:[115,-40],fa:[100,-10],bl:10},
 sheath:{lean:5,th:[18,-14],sh:[4,-10],ua:[25,20],fa:[85,75],bl:172},
 iaiReady:{lean:28,th:[55,-35],sh:[0,-15],ua:[15,45],fa:[55,75],bl:172},
 iaiDone:{lean:15,th:[52,-42],sh:[10,-22],ua:[90,-40],fa:[90,-20],bl:-5},
 upper:{lean:-10,th:[25,-15],sh:[5,-10],ua:[170,-20],fa:[175,10],bl:-100},
 eguard:{lean:5,th:[18,-14],sh:[4,-10],ua:[60,50],fa:[150,140],bl:-100},
 ebreak:{lean:-25,th:[28,-20],sh:[10,-10],ua:[150,120],fa:[170,150],bl:-140},
 estag:{lean:-14,th:[22,-18],sh:[8,-10],ua:[100,80],fa:[125,105],bl:-120},
 eknock:{lean:-88,th:[82,70],sh:[88,80],ua:[-120,-100],fa:[-150,-120],bl:-170},
 elarge:{lean:-38,th:[10,-30],sh:[-10,-30],ua:[50,40],fa:[90,80],bl:-150},
 eair:{lean:-20,th:[30,10],sh:[-10,-20],ua:[120,100],fa:[140,120],bl:-150},
 epierce:{lean:18,th:[15,-10],sh:[0,-5],ua:[40,30],fa:[60,50],bl:-60},
 ekneel:{lean:30,th:[80,0],sh:[0,-90],ua:[20,10],fa:[30,20],bl:-60},
 ehitL:{lean:-20,th:[22,-18],sh:[8,-10],ua:[80,40],fa:[100,70],bl:-120},
 ehitR:{lean:10,th:[22,-18],sh:[8,-10],ua:[40,90],fa:[70,120],bl:-80}
};
const mk=(name,o)=>Object.assign({},BASE,P[name],o);
function samp(keys,t){
 if(t<=keys[0][0])return keys[0][1];
 for(let i=0;i<keys.length-1;i++){const[a,pa]=keys[i],[b,pb,e]=keys[i+1];if(t<b){let k=(t-a)/(b-a);k=e==='o'?ease(k):e==='h'?0:sm(k);return mix(pa,pb,k)}}
 return keys[keys.length-1][1];
}
function mix(a,b,k){const o={face:k<.5?a.face:b.face};for(const n of['x','air','lean','bl'])o[n]=lerp(a[n],b[n],k);for(const n of['th','sh','ua','fa'])o[n]=[lerp(a[n][0],b[n][0],k),lerp(a[n][1],b[n][1],k)];o.sc=lerp(a.sc||1,b.sc||1,k);return o}
function joints(p){
 const s=p.sc||1,f=p.face,dv=a=>[Math.sin(a*D2R)*f,Math.cos(a*D2R)];
 const TH=22*s,TO=34*s,UA=17*s,FA=16*s;
 const dep=Math.max(...[0,1].map(i=>Math.cos(p.th[i]*D2R)*TH+Math.cos(p.sh[i]*D2R)*TH));
 const hip=[p.x,GY-Math.max(dep,4*s)-p.air];
 const tv=[Math.sin(p.lean*D2R)*f,-Math.cos(p.lean*D2R)];
 const sh=[hip[0]+tv[0]*TO,hip[1]+tv[1]*TO],head=[hip[0]+tv[0]*(TO+11*s),hip[1]+tv[1]*(TO+11*s)];
 const leg=i=>{const k=dv(p.th[i]),kn=[hip[0]+k[0]*TH,hip[1]+k[1]*TH],q=dv(p.sh[i]);return[kn,[kn[0]+q[0]*TH,kn[1]+q[1]*TH]]};
 const arm=i=>{const k=dv(p.ua[i]),el=[sh[0]+k[0]*UA,sh[1]+k[1]*UA],q=dv(p.fa[i]);return[el,[el[0]+q[0]*FA,el[1]+q[1]*FA]]};
 const bd=[Math.cos(p.bl*D2R)*f,Math.sin(p.bl*D2R)];
 return{s,hip,sh,head,legs:[leg(0),leg(1)],arms:[arm(0),arm(1)],bd};
}
function fig(g,p,col,o={}){
 const j=joints(p),s=j.s,al=o.a??1;
 g.save();g.globalAlpha=al;g.lineCap='round';g.lineJoin='round';
 const dark=col.map(v=>v*.55|0);
 const limb=(pts,c,w)=>{g.strokeStyle=rgba(c,1);g.lineWidth=w;g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(const q of pts.slice(1))g.lineTo(q[0],q[1]);g.stroke()};
 limb([j.hip,...j.legs[1]],dark,4.5*s);limb([j.sh,...j.arms[1]],dark,4*s);
 if(o.gat)drawGat(g,j);
 limb([j.hip,j.sh],col,6*s);limb([j.hip,...j.legs[0]],col,4.5*s);
 g.fillStyle=rgba(col,1);g.beginPath();g.arc(j.head[0],j.head[1],8*s,0,7);g.fill();
 if(o.scarf){g.strokeStyle='rgba(200,40,50,1)';g.lineWidth=3;g.beginPath();g.moveTo(j.sh[0]+2*p.face*-1,j.sh[1]-4);g.quadraticCurveTo(j.sh[0]-18*p.face,j.sh[1]-2+Math.sin((o.t||0)*.2)*3,j.sh[0]-30*p.face,j.sh[1]+6);g.stroke()}
 if(o.sword!==false){const h=j.arms[0][1],L=58*s;g.strokeStyle=o.swordCol||'rgba(235,238,245,1)';g.lineWidth=2.2*s;g.beginPath();g.moveTo(h[0]-j.bd[0]*8*s,h[1]-j.bd[1]*8*s);g.lineTo(h[0]+j.bd[0]*L,h[1]+j.bd[1]*L);g.stroke();
  g.strokeStyle=rgba([40,30,40],1);g.lineWidth=3.4*s;g.beginPath();g.moveTo(h[0]-j.bd[0]*8*s,h[1]-j.bd[1]*8*s);g.lineTo(h[0]+j.bd[0]*2*s,h[1]+j.bd[1]*2*s);g.stroke()}
 limb([j.sh,...j.arms[0]],col,4*s);
 g.restore();return j;
}
function drawGat(g,j){const h=j.arms[1][1];g.fillStyle='#5a5560';g.save();g.translate(h[0],h[1]);g.fillRect(-26,-9,40,18);g.fillStyle='#3a363f';for(let i=0;i<3;i++)g.fillRect(-46,-7+i*5,22,3);g.restore()}
const tipOf=(j,len=58)=>{const h=j.arms[0][1];return[h[0]+j.bd[0]*len*j.s,h[1]+j.bd[1]*len*j.s]};

// ---- 動き ----
function playerPose(plan,t){
 const pre=[[0,mk('stand',{x:230})],[14,mk('wind',{x:236})],[BRK,mk('strike',{x:252}),'o'],[30,mk('strike',{x:252})],[YP,mk('stand',{x:250})]];
 if(t<YP)return samp(pre,t);
 const u=t-YP,K=PK[plan];return samp(K,u);
}
const PK={
 A:[[0,mk('stand',{x:250})],[6,mk('crouch',{x:255})],[14,mk('jump',{x:278,air:60}),'o'],[24,mk('jump',{x:300,air:118})],[34,mk('jump',{x:305,air:124})],[40,mk('slam',{x:308}),'o'],[46,mk('slam',{x:308})],[80,mk('slam',{x:308})],[104,mk('stand',{x:300})]],
 B:[[0,mk('stand',{x:250})],[8,mk('thrustPre',{x:262})],[12,mk('thrust',{x:298}),'o'],[40,mk('thrust',{x:298})],[44,mk('kick',{x:300}),'o'],[60,mk('kick',{x:300})],[84,mk('stand',{x:292})]],
 C:[[0,mk('stand',{x:250})],[4,mk('crouch',{x:255})],[12,mk('dashEnd',{x:430}),'o'],[24,mk('dashEnd',{x:430})],[46,mk('stand',{x:432})],[70,mk('sheath',{x:432})]],
 D:[[0,mk('stand',{x:250})],[12,mk('iaiReady',{x:256})],[18,mk('iaiReady',{x:256})],[20,mk('iaiDone',{x:292}),'o'],[60,mk('iaiDone',{x:292})],[88,mk('stand',{x:290})]],
 E:(()=>{const k=[[0,mk('stand',{x:250})]];const sl=[6,14,22,30,38];sl.forEach((s,i)=>{const L=i%2==0,x=L?290:372,f=L?1:-1;k.push([s-3,mk('wind',{x,face:f})]);k.push([s,mk('strike',{x:x+(L?6:-6),face:f}),'o'])});k.push([46,mk('wind',{x:282,face:1,lean:-12})]);k.push([54,mk('strike',{x:300,face:1,lean:30}),'o']);k.push([80,mk('strike',{x:300})]);k.push([104,mk('stand',{x:296})]);return k})(),
 F:[[0,mk('stand',{x:250})],[6,mk('crouchLow',{x:268})],[14,mk('upper',{x:290}),'o'],[28,mk('upper',{x:292})],[34,mk('crouch',{x:295})],[48,mk('jump',{x:305,air:128}),'o'],[52,mk('kick',{x:308,air:132}),'o'],[60,mk('kick',{x:306,air:110})],[74,mk('crouch',{x:300}),'o'],[96,mk('stand',{x:298})]],
 L:[[0,mk('stand',{x:250})],[6,mk('crouchLow',{x:265})],[14,mk('upper',{x:285}),'o'],[24,mk('upper',{x:288})],[30,mk('crouch',{x:292})],[46,mk('jump',{x:310,air:120}),'o'],[120,mk('jump',{x:312,air:126})]]
};
const EX=330,BOSSX=372;
function enemyPose(plan,t){
 const boss=plan==='F',x=boss?BOSSX:EX,sc=boss?1.5:1,e=n=>o=>mk(n,Object.assign({x,face:-1,sc},o));
 const w=wt(t),sway=Math.sin(w*.5)*4;
 const pre=[[0,e('eguard')()],[BRK,e('eguard')({x:x})],[BRK+6,e('ebreak')({x:x+10}),'o'],[CH0,e('ebreak')({x:x+12})],[WYP,e('estag')({x:x+12})]];
 if(t<YP){const p=samp(pre,w);if(t>=CH0)p.lean+=sway*.5;return p}
 const u=t-YP,X=x+12;
 const K={
  A:[[0,e('estag')({x:X})],[38,e('estag')({x:X})],[42,e('eknock')({x:X+38}),'o']],
  B:[[0,e('estag')({x:X})],[12,e('epierce')({x:X-4}),'o'],[44,e('epierce')({x:X-4})],[56,e('elarge')({x:X+120,air:30}),'o'],[70,e('elarge')({x:X+200,air:8})],[76,e('eknock')({x:X+225})]],
  C:[[0,e('estag')({x:X})],[12,e('estag')({x:X,lean:-4}),'o'],[74,e('estag')({x:X,lean:-4})],[88,e('ekneel')({x:X+4}),'o'],[106,e('ekneel')({x:X+4})],[120,e('eknock')({x:X+20})]],
  D:[[0,e('estag')({x:X})],[20,e('estag')({x:X})],[22,e('elarge')({x:X+20,air:10}),'o'],[44,e('elarge')({x:X+110,air:16})],[52,e('eknock')({x:X+130})]],
  E:(()=>{const k=[[0,e('estag')({x:X})]];[6,14,22,30,38].forEach((s,i)=>{k.push([s,e(i%2?'ehitR':'ehitL')({x:X}),'o']);k.push([s+5,e('estag')({x:X})])});k.push([54,e('elarge')({x:X+30,air:16}),'o']);k.push([76,e('elarge')({x:X+120,air:10})]);k.push([84,e('eknock')({x:X+138})]);return k})(),
  F:[[0,e('estag')({x:X})],[62,e('estag')({x:X})],[66,e('elarge')({x:X+24}),'o'],[96,e('estag')({x:X+30})]],
  L:[[0,e('estag')({x:X})],[13,e('estag')({x:X})],[16,e('eair')({x:X+6,air:20}),'o'],[42,e('eair')({x:X+12,air:150}),'o'],[120,e('eair')({x:X+14,air:158})]]
 }[plan];

   for(let i=0;i<14;i++){const aa=a;if(aa>40)break;const an=nz(i+300)*6.28,v=2+nz(i+310)*3;glow(g,x+Math.cos(an)*v*aa,y+Math.sin(an)*v*aa*.7-aa*.5,10+aa*.5,[70,64,74],.5*(1-aa/40))}
   shards(g,x,y,a,{n:30,v:6,gr:.2,seed:320})}
 },
 L(g,u,pj,ej){
  arc(g,pj.sh[0],pj.sh[1],60,1.2,-1.6,u-10,12,SIL,7);
  if(u>=14&&u<44)for(let i=0;i<4;i++)streak(g,ej.hip[0]-12+i*8,ej.hip[1]+40,ej.hip[0]-12+i*8,ej.hip[1]+5,u-14,30,[200,200,220],2);
  if(u>=20){g.save();g.fillStyle='rgba(255,200,120,.9)';g.font='13px "Yu Gothic UI",sans-serif';g.fillText('↑ 普段のコンボ(X→Y)の打ち上げと同じに見える',350,120);g.restore()}
 }
};
function glowAt(g,pj,a){const tp=tipOf(pj);g.save();g.globalCompositeOperation='lighter';glow(g,tp[0],tp[1],30,WHITE,1-a/6);g.restore()}

// ---- 画面 ----
const cv=document.getElementById('cv'),g=cv.getContext('2d');
let plan='A',brk=1,t=0,playing=true,acc=0,all=false;
const pb=document.getElementById('plans'),bb=document.getElementById('brks'),seek=document.getElementById('seek'),grid=document.getElementById('grid');
seek.max=TOTAL-1;
ORDER.forEach(k=>{const b=document.createElement('button');b.textContent=PL[k].name;b.onclick=()=>{plan=k;all=false;sync()};b.dataset.k=k;pb.appendChild(b)});
BRKS.forEach((v,i)=>{const b=document.createElement('button');b.textContent=v.name;b.onclick=()=>{brk=i;sync()};b.dataset.k=i;bb.appendChild(b)});
document.getElementById('play').onclick=()=>{playing=!playing;sync()};
document.getElementById('allb').onclick=()=>{all=!all;sync()};
seek.oninput=()=>{t=+seek.value;playing=false;sync()};
const subs=ORDER.map(k=>{const d=document.createElement('div'),c=document.createElement('canvas');c.width=640;c.height=360;d.appendChild(c);const s=document.createElement('span');s.textContent=PL[k].name;d.appendChild(s);grid.appendChild(d);return{k,c,g:c.getContext('2d')}});
function sync(){
 document.body.classList.toggle('all',all);
 [...pb.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',!all&&b.dataset.k===plan));
 [...bb.querySelectorAll('button')].forEach(b=>b.classList.toggle('on',+b.dataset.k===brk));
 document.getElementById('play').textContent=playing?'一時停止':'再生';
 document.getElementById('allb').classList.toggle('on',all);
 const dl=document.getElementById('desc');dl.innerHTML='';
 for(const[a,b]of[...BRKS[brk].d,...(all?[]:PL[plan].d)]){const dt=document.createElement('dt');dt.textContent=a;const dd=document.createElement('dd');dd.textContent=b;dl.append(dt,dd)}
 draw();
}
function draw(){
 seek.value=t;document.getElementById('ph').textContent=`${t} / ${TOTAL-1}F(60fps)`;
 if(all)subs.forEach(s=>render(s.g,s.k,brk,t));else render(g,plan,brk,t);
}
let last=performance.now();
function loop(now){const dt=now-last;last=now;if(playing){acc+=dt*(document.getElementById('slow').checked?.5:1)/16.667;while(acc>=1){acc--;t=(t+1)%TOTAL}draw()}requestAnimationFrame(loop)}
// #A,150,1 / #all,150,0
(function(){const h=decodeURIComponent(location.hash.slice(1));if(!h)return;const[a,b,c]=h.split(',');if(a==='all')all=true;else if(PL[a])plan=a;if(b!==undefined&&b!==''){t=Math.max(0,Math.min(TOTAL-1,+b|0));playing=false}if(c!==undefined)brk=Math.max(0,Math.min(3,+c|0))})();
sync();requestAnimationFrame(loop);
</script>
